                      <button onClick={()=>editWoReminder(r)} title="Edit" style={{padding:"5px 10px",background:"#1a1a2e",color:"#fff",border:"none",borderRadius:5,cursor:"pointer",fontSize:11}}>✏️</button>
                      <button onClick={()=>delWoReminder(r.id)} title="Delete" style={{padding:"5px 10px",background:"#fdecea",color:"#c0392b",border:"none",borderRadius:5,cursor:"pointer",fontSize:11}}>🗑</button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
          {jobTab==="photos"&&(
            <div>
              <PhotoSection entityType="work_order" entityId={jobsModal.id}/>
            </div>
          )}
            </div>
          </div>
        </Modal>
      )}

    </div>
  );
};

// ─── CUSTOMERS ────────────────────────────────────────────────────────────────
const Customers = () => {
  const user = useContext(UserCtx);
  const guard = useOnce();
  const [list,setList]=useState([]); const [loading,setLoading]=useState(true);
  const [modal,setModal]=useState(false); const [search,setSearch]=useState(""); const [sort,setSort]=useState("recent");
  const [equipTarget,setEquipTarget]=useState(null);
  const [editId,setEditId]=useState(null);
  const EMPTY={name:"",address:"",phone:"",email:"",notes:"",mc_number:"",dot_number:"",truck_count:"",trailer_count:""};
  const [form,setForm]=useState(EMPTY);
  const [paidByCustomer,setPaidByCustomer]=useState({});
  const [remCountByCustomer,setRemCountByCustomer]=useState({});
  const [remTarget,setRemTarget]=useState(null);
  const [custReminders,setCustReminders]=useState([]);
  const [custEquipment,setCustEquipment]=useState([]);
  const [custWos,setCustWos]=useState([]);
  const [custRemForm,setCustRemForm]=useState({id:null,equipment_id:"",work_order_id:"",reminder_date:"",note:""});
  const [custPhotos,setCustPhotos]=useState({}); // customer id (string) → photos[]
  // One query for all customer cards instead of one per PhotoSection.
  const loadCustPhotos=async(ids)=>{
    if(!ids.length){setCustPhotos({});return;}
    const{data}=await sb.from('photos').select('*').eq('entity_type','customer').in('entity_id',ids.map(String)).order('created_at',{ascending:false});
    const m={};(data||[]).forEach(p=>{(m[p.entity_id]=m[p.entity_id]||[]).push(p);});
    setCustPhotos(m);
  };
  const load=async()=>{const{data}=await sb.from('customers').select('*').order('created_at',{ascending:false});setList(data||[]);setLoading(false);loadCustPhotos((data||[]).map(c=>c.id));};
  const loadPaid=async()=>{
    const{data}=await sb.from('work_orders').select('customer').eq('status','Paid').eq('is_voided',false);
    const map={};(data||[]).forEach(w=>{map[w.customer]=(map[w.customer]||0)+1;});
    setPaidByCustomer(map);
  };
  const loadRemCounts=async()=>{
    const{data}=await sb.from('reminders').select('customer_name').eq('completed',false);
    const map={};(data||[]).forEach(r=>{map[r.customer_name]=(map[r.customer_name]||0)+1;});
    setRemCountByCustomer(map);
  };
  const loadCustReminders=async(custName)=>{
    const{data}=await sb.from('reminders').select('*').eq('customer_name',custName).order('created_at',{ascending:false});
    setCustReminders(data||[]);
  };
  const openCustReminders=async(c)=>{
    setRemTarget(c);
    const[er,wr]=await Promise.all([
      sb.from('equipment').select('*').eq('customer_id',c.id),
      sb.from('work_orders').select('id,unit_number').eq('customer',c.name).eq('is_voided',false)
    ]);
    setCustEquipment(er.data||[]); setCustWos(wr.data||[]);
    await loadCustReminders(c.name);
  };
  const closeCustReminders=()=>{setRemTarget(null);setCustReminders([]);setCustRemForm({id:null,equipment_id:"",work_order_id:"",reminder_date:"",note:""});loadRemCounts();};
  const saveCustReminder=async()=>{
    const t=(custRemForm.note||"").trim(); if(!t)return;
    const eqId=custRemForm.equipment_id?Number(custRemForm.equipment_id):null;
    const eqRow=eqId?custEquipment.find(e=>e.id===eqId):null;
    const label=eqRow?`${eqRow.year||""} ${eqRow.make||""} ${eqRow.model||eqRow.type||""}`.trim()+(eqRow.unit_number?` · #${eqRow.unit_number}`:"")+(eqRow.vin?` · ${eqRow.vin}`:""):(custRemForm.work_order_id?`WO ${custRemForm.work_order_id}`:remTarget.name);
    const payload={customer_name:remTarget.name,equipment_id:eqId,equipment_label:label.trim(),work_order_id:custRemForm.work_order_id||null,reminder_date:custRemForm.reminder_date||null,note:t,created_by:user.name};
    if(custRemForm.id){
      const res=await sb.from('reminders').update(payload).eq('id',custRemForm.id);
      if(res.error){alert("Could not save: "+res.error.message);return;}
      audit(user,"update","reminder",custRemForm.id,`${remTarget.name} — ${label}`,t.slice(0,120));
    }else{
      const {data:inserted,error}=await sb.from('reminders').insert([payload]).select().single();
      if(error){alert("Could not save: "+error.message);return;}
      audit(user,"create","reminder",inserted?.id,`${remTarget.name} — ${label}`,t.slice(0,120));
    }
    setCustRemForm({id:null,equipment_id:"",work_order_id:"",reminder_date:"",note:""});
    loadCustReminders(remTarget.name);
  };
  const editCustReminder=r=>setCustRemForm({id:r.id,equipment_id:r.equipment_id?String(r.equipment_id):"",work_order_id:r.work_order_id||"",reminder_date:r.reminder_date||"",note:r.note||""});
  const completeCustReminder=async(id)=>{const prev=custReminders.find(x=>x.id===id);const r=await must(sb.from('reminders').update({completed:true}).eq('id',id).eq('completed',false).select(),"Could not complete reminder");if(!r)return;if(r.data&&r.data.length){audit(user,"status_change","reminder",id,`${remTarget?.name||""}`,`completed: false → true`);await rescheduleAutoReminder(user,prev);}loadCustReminders(remTarget.name);bumpReminders();};
  const delCustReminder=async(id)=>{if(!confirm("Delete reminder?"))return;const r=await must(sb.from('reminders').delete().eq('id',id),"Could not delete reminder");if(!r)return;audit(user,"delete","reminder",id,`${remTarget?.name||""}`);loadCustReminders(remTarget.name);bumpReminders();if(custRemForm.id===id)setCustRemForm({id:null,equipment_id:"",work_order_id:"",reminder_date:"",note:""});};
  useEffect(()=>{load();loadPaid();loadRemCounts();},[]);
  const q=search.toLowerCase();
  const filtered=list.filter(c=>(c.name||"").toLowerCase().includes(q)||(c.email||"").toLowerCase().includes(q)||(c.mc_number||"").toLowerCase().includes(q)||(c.dot_number||"").toLowerCase().includes(q));
  // Sort a copy (don't mutate `list`). "jobs" = completed (Paid) work orders per customer, from paidByCustomer.
  const jobsDone=c=>paidByCustomer[c.name]||0;
  const nameOf=c=>(c.name||"").toLowerCase();
  const sorted=[...filtered].sort((a,b)=>{
    if(sort==="az") return nameOf(a).localeCompare(nameOf(b));
    if(sort==="za") return nameOf(b).localeCompare(nameOf(a));
    if(sort==="jobs") return jobsDone(b)-jobsDone(a) || nameOf(a).localeCompare(nameOf(b));
    // "recent" — newest first, matching the created_at desc load order
    return new Date(b.created_at||0)-new Date(a.created_at||0);
  });
  const openAdd=()=>{setForm(EMPTY);setEditId(null);setModal(true);};
  const openEdit=(c)=>{setForm({name:c.name||"",address:c.address||"",phone:c.phone||"",email:c.email||"",notes:c.notes||"",mc_number:c.mc_number||"",dot_number:c.dot_number||"",truck_count:c.truck_count??"",trailer_count:c.trailer_count??""});setEditId(c.id);setModal(true);};
  const closeModal=()=>{setModal(false);setEditId(null);setForm(EMPTY);};
  const save=async()=>{
    if(!form.name)return;
    const payload={...form,truck_count:form.truck_count===""||form.truck_count==null?null:Number(form.truck_count),trailer_count:form.trailer_count===""||form.trailer_count==null?null:Number(form.trailer_count)};
    if(editId){
      const prev=list.find(c=>c.id===editId);
      const res=await sb.from('customers').update(payload).eq('id',editId);
      if(res.error){alert("Could not save: "+res.error.message);return;}
      if(prev&&prev.name!==payload.name){
        // WOs, reminders, equipment, and appointments link to the customer by NAME
        // string — without this cascade, renaming orphans every one of those links
        // (contact card vanishes, badges reset, reminders detach).
        const rs=await Promise.all([
          sb.from('work_orders').update({customer:payload.name}).eq('customer',prev.name),
          sb.from('reminders').update({customer_name:payload.name}).eq('customer_name',prev.name),
          sb.from('equipment').update({customer_name:payload.name}).eq('customer_name',prev.name),
          sb.from('appointments').update({company:payload.name}).eq('company',prev.name),
          sb.from('notes').update({customer_name:payload.name}).eq('customer_name',prev.name)
        ]);
        const bad=rs.find(r=>r.error);
        if(bad)alert("Customer renamed, but some linked records could not be updated: "+bad.error.message);
        audit(user,"update","customer",editId,payload.name,`renamed from "${prev.name}" (cascaded to WOs/reminders/equipment/appointments/notes)`);
        loadPaid();loadRemCounts(); // badge maps are keyed by name
      }else{
        audit(user,"update","customer",editId,form.name);
      }
    }else{
      const {data:inserted,error}=await sb.from('customers').insert([payload]).select().single();
      if(error){alert("Could not save: "+error.message);return;}
      audit(user,"create","customer",inserted?.id,form.name);
    }
    closeModal();load();
  };
  const del=async(id)=>{
    if(!confirm("Delete customer?"))return;
    const prev=list.find(c=>c.id===id);
    const r=await must(sb.from('customers').delete().eq('id',id),"Could not delete customer");
    if(!r)return;
    audit(user,"delete","customer",id,prev?.name||"");
    load();
  };
  if(loading) return <Loading/>;
  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <h1 style={{margin:0,fontSize:26,fontWeight:800,color:"#1a1a2e"}}>Customers</h1>
        <Btn label="Add new customer" onClick={openAdd} color="#c0392b"/>
      </div>
      <div style={{background:"#fff",borderRadius:12,padding:24,boxShadow:"0 2px 12px rgba(0,0,0,0.06)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <div><h3 style={{margin:"0 0 2px",fontSize:16,fontWeight:700}}>Your Customers</h3><p style={{margin:0,fontSize:13,color:"#888"}}>Total: {filtered.length}</p></div>
          <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <select value={sort} onChange={e=>setSort(e.target.value)} style={{padding:"8px 12px",border:"1px solid #ddd",borderRadius:8,fontSize:13,background:"#fff",cursor:"pointer",color:"#333"}}>
              <option value="recent">Sort: Date added</option>
              <option value="az">Sort: Name A–Z</option>
              <option value="za">Sort: Name Z–A</option>
              <option value="jobs">Sort: Jobs done</option>
            </select>
            <div style={{position:"relative"}}><span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",color:"#aaa"}}>🔍</span><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search..." style={{padding:"8px 12px 8px 32px",border:"1px solid #ddd",borderRadius:8,fontSize:13}}/></div>
          </div>
        </div>
        {sorted.map(c=>(
          <div key={c.id} style={{border:"1px solid #eee",borderRadius:10,padding:16,marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div style={{flex:1}}>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4,flexWrap:"wrap"}}>
                  <div style={{fontWeight:700,fontSize:15}}>{c.name}</div>
                  {(paidByCustomer[c.name]||0)>0&&<span style={{background:"#eafaf1",color:"#1e8449",border:"1px solid #a9dfbf",padding:"2px 9px",borderRadius:20,fontSize:11,fontWeight:700}}>✅ {paidByCustomer[c.name]} job{paidByCustomer[c.name]===1?"":"s"} completed</span>}
                </div>
                <div style={{fontSize:13,color:"#666",marginBottom:4}}>{c.address}</div>
                {(c.mc_number||c.dot_number)&&<div style={{fontSize:12,color:"#555",marginBottom:6,fontFamily:"monospace"}}>{c.mc_number&&<span><strong>MC#</strong> {c.mc_number}</span>}{c.mc_number&&c.dot_number&&<span style={{color:"#bbb"}}> &nbsp;·&nbsp; </span>}{c.dot_number&&<span><strong>DOT#</strong> {c.dot_number}</span>}</div>}
                {(c.truck_count!=null||c.trailer_count!=null)&&<div style={{fontSize:12,color:"#555",marginBottom:6}}>🚛 {c.truck_count??0} truck{c.truck_count===1?"":"s"} &nbsp;·&nbsp; 🛻 {c.trailer_count??0} trailer{c.trailer_count===1?"":"s"}</div>}
                {c.notes&&<div style={{fontSize:12,color:"#888",marginBottom:6}}><strong>Notes:</strong> {c.notes}</div>}
                <div style={{fontSize:13,color:"#555"}}>📞 {c.phone} &nbsp; ✉️ {c.email}</div>
              </div>
              <div style={{display:"flex",gap:8,marginLeft:16,flexWrap:"wrap",justifyContent:"flex-end"}}>
                <button onClick={()=>setEquipTarget(c)} style={{padding:"8px 14px",background:"#3498db",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600}}>🚛 Equipment</button>
                <button onClick={()=>openCustReminders(c)} style={{padding:"8px 14px",background:"#e67e22",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600}}>🔔 Reminders{remCountByCustomer[c.name]?` (${remCountByCustomer[c.name]})`:""}</button>
                <button onClick={()=>openEdit(c)} style={{padding:"8px 14px",background:"#1a1a2e",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600}}>✏️ Edit</button>
                <button onClick={()=>del(c.id)} style={{padding:"8px 12px",background:"#c0392b",color:"#fff",border:"none",borderRadius:8,cursor:"pointer"}}>🗑</button>
              </div>
            </div>
            <div style={{marginTop:10}}>
              <PhotoSection entityType="customer" entityId={c.id} compact={true} label="Customer photos" photos={custPhotos[String(c.id)]||[]} onChanged={load}/>
            </div>
          </div>
        ))}
        {filtered.length===0&&<p style={{color:"#aaa",textAlign:"center",padding:30}}>No customers yet.</p>}
      </div>
      {modal&&(
        <Modal title={editId?"Edit Customer":"Add Customer"} onClose={closeModal}>
          <Field label="Company Name" value={form.name} onChange={v=>setForm(p=>({...p,name:v}))} required/>
          <Field label="Address" value={form.address} onChange={v=>setForm(p=>({...p,address:v}))}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <Field label="Phone" value={form.phone} onChange={v=>setForm(p=>({...p,phone:v}))} type="tel" autoComplete="tel"/>
            <Field label="Email" value={form.email} onChange={v=>setForm(p=>({...p,email:v}))} type="email"/>
            <Field label="MC #" value={form.mc_number} onChange={v=>setForm(p=>({...p,mc_number:v}))} placeholder="e.g. 123456" inputMode="numeric"/>
            <Field label="DOT #" value={form.dot_number} onChange={v=>setForm(p=>({...p,dot_number:v}))} placeholder="e.g. 7654321" inputMode="numeric"/>
            <Field label="# of trucks" value={form.truck_count} onChange={v=>setForm(p=>({...p,truck_count:v}))} type="number" placeholder="e.g. 8"/>
            <Field label="# of trailers" value={form.trailer_count} onChange={v=>setForm(p=>({...p,trailer_count:v}))} type="number" placeholder="e.g. 12"/>
          </div>
          <Field label="Notes" value={form.notes} onChange={v=>setForm(p=>({...p,notes:v}))} type="textarea"/>
          <div style={{display:"flex",justifyContent:"flex-end",gap:10}}>
            <button onClick={closeModal} style={{padding:"10px 18px",background:"#f0f0f0",border:"none",borderRadius:8,cursor:"pointer"}}>Cancel</button>
            <button onClick={()=>guard(save)} style={{padding:"10px 18px",background:"#c0392b",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:600}}>{editId?"Save Changes":"Add"}</button>
          </div>
        </Modal>
      )}
      {equipTarget&&<EquipmentModal customerId={equipTarget.id} customerName={equipTarget.name} onClose={()=>setEquipTarget(null)}/>}
      {remTarget&&(
        <Modal title={`🔔 Reminders — ${remTarget.name}`} onClose={closeCustReminders} wide>
          <div style={{background:"#f8f9fa",borderRadius:10,padding:14,marginBottom:14}}>
            <div style={{fontSize:13,fontWeight:700,color:"#555",marginBottom:8}}>{custRemForm.id?"Edit reminder":`Add reminder for ${remTarget.name}`}</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <div style={{marginBottom:14}}>
                <label style={{display:"block",fontSize:13,fontWeight:600,color:"#555",marginBottom:5}}>Equipment (optional)</label>
                <select value={custRemForm.equipment_id} onChange={e=>setCustRemForm(p=>({...p,equipment_id:e.target.value}))} style={{width:"100%",padding:"9px 12px",border:"1px solid #ddd",borderRadius:8,fontSize:14,background:"#fff"}}>
                  <option value="">— None —</option>
                  {custEquipment.map(e=>{const lbl=`${e.year||""} ${e.make||""} ${e.model||e.type||""}`.trim()+(e.unit_number?` · #${e.unit_number}`:"")+(e.vin?` · ${e.vin}`:""); return <option key={e.id} value={String(e.id)}>{lbl||`Equipment ${e.id}`}</option>;})}
                </select>
              </div>
              <div style={{marginBottom:14}}>
                <label style={{display:"block",fontSize:13,fontWeight:600,color:"#555",marginBottom:5}}>Work Order (optional)</label>
                <select value={custRemForm.work_order_id} onChange={e=>setCustRemForm(p=>({...p,work_order_id:e.target.value}))} style={{width:"100%",padding:"9px 12px",border:"1px solid #ddd",borderRadius:8,fontSize:14,background:"#fff"}}>
                  <option value="">— None —</option>
                  {custWos.map(w=><option key={w.id} value={w.id}>{w.id}{w.unit_number?` · Unit ${w.unit_number}`:""}</option>)}
                </select>
              </div>
            </div>
            <Field label="Due date" value={custRemForm.reminder_date} onChange={v=>setCustRemForm(p=>({...p,reminder_date:v}))} type="date"/>
            <Field label="Note" value={custRemForm.note} onChange={v=>setCustRemForm(p=>({...p,note:v}))} type="textarea" required placeholder="e.g. Annual DOT inspection due, contact for service..."/>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>guard(saveCustReminder)} style={{padding:"9px 16px",background:"#c0392b",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>{custRemForm.id?"Save Changes":"+ Add Reminder"}</button>
              {custRemForm.id&&<button onClick={()=>setCustRemForm({id:null,equipment_id:"",work_order_id:"",reminder_date:"",note:""})} style={{padding:"9px 16px",background:"#f0f0f0",border:"none",borderRadius:8,cursor:"pointer",fontSize:13}}>Cancel edit</button>}
            </div>
          </div>
          {custReminders.length===0?<p style={{color:"#aaa",fontSize:13,textAlign:"center",padding:20}}>No reminders for this customer yet.</p>:custReminders.map(r=>{
            const today=todayLocal();
            const overdue=!r.completed&&r.reminder_date&&r.reminder_date<today;
            return (
              <div key={r.id} style={{border:`1px solid ${r.completed?"#a9dfbf":overdue?"#f5c6cb":"#eee"}`,borderRadius:10,padding:14,marginBottom:10,background:r.completed?"#f9fff9":overdue?"#fff5f5":"#fff"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:600,fontSize:14,color:r.completed?"#888":"#1a1a2e",textDecoration:r.completed?"line-through":""}}>{r.note}</div>
                    <div style={{fontSize:12,color:"#888",marginTop:4}}>
                      {r.equipment_label&&<span>📋 {r.equipment_label} &nbsp;</span>}
                      {r.work_order_id&&<span>🔧 {r.work_order_id} &nbsp;</span>}
                      {r.reminder_date&&<span>📅 {fmtDay(r.reminder_date)} &nbsp;</span>}
                      <span>👤 {r.created_by} · {fmtDate(r.created_at)}</span>
                    </div>
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    {!r.completed&&<button onClick={()=>completeCustReminder(r.id)} title="Mark done" style={{padding:"5px 10px",background:"#27ae60",color:"#fff",border:"none",borderRadius:5,cursor:"pointer",fontSize:11,fontWeight:600}}>✓</button>}
                    <button onClick={()=>editCustReminder(r)} title="Edit" style={{padding:"5px 10px",background:"#1a1a2e",color:"#fff",border:"none",borderRadius:5,cursor:"pointer",fontSize:11}}>✏️</button>
                    <button onClick={()=>delCustReminder(r.id)} title="Delete" style={{padding:"5px 10px",background:"#fdecea",color:"#c0392b",border:"none",borderRadius:5,cursor:"pointer",fontSize:11}}>🗑</button>
                  </div>
                </div>
              </div>
            );
          })}
        </Modal>
      )}
    </div>
  );
};

// ─── APPOINTMENTS ─────────────────────────────────────────────────────────────
const Appointments = () => {
  const user = useContext(UserCtx);
  const guard = useOnce();
  const [list,setList]=useState([]); const [loading,setLoading]=useState(true);
  const [customers,setCustomers]=useState([]); const [modal,setModal]=useState(false);
  const [form,setForm]=useState({company:"",unit_number:"",vin:"",date:"",status:"Scheduled"});
  const load=async()=>{const{data}=await sb.from('appointments').select('*').order('date',{ascending:true});setList(data||[]);setLoading(false);};
  useEffect(()=>{load();sb.from('customers').select('name').order('name').then(({data})=>setCustomers(data||[]));},[]);
  const add=async()=>{
    if(!form.company)return;
    const {data:inserted,error}=await sb.from('appointments').insert([form]).select().single();
    if(error){alert("Could not add appointment: "+error.message);return;}
    audit(user,"create","appointment",inserted?.id,`${form.company} ${form.unit_number?`(${form.unit_number})`:""}`,`date: ${form.date||"—"}, status: ${form.status}`);
    setModal(false);setForm({company:"",unit_number:"",vin:"",date:"",status:"Scheduled"});load();
  };
  const del=async(id)=>{
    if(!confirm("Delete?"))return;
    const prev=list.find(a=>a.id===id);
    const r=await must(sb.from('appointments').delete().eq('id',id),"Could not delete appointment");
    if(!r)return;
    audit(user,"delete","appointment",id,`${prev?.company||""} ${prev?.unit_number?`(${prev.unit_number})`:""}`);
    load();
  };
  if(loading) return <Loading/>;
  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <h1 style={{margin:0,fontSize:26,fontWeight:800,color:"#1a1a2e"}}>Appointments</h1>
        <Btn label="Add appointment" onClick={()=>setModal(true)} color="#c0392b"/>
      </div>
      <div style={{background:"#fff",borderRadius:12,overflow:"auto",boxShadow:"0 2px 12px rgba(0,0,0,0.06)"}}>
        <table style={{width:"100%",borderCollapse:"collapse",minWidth:640}}>
          <thead><tr><TH c="No."/><TH c="Company"/><TH c="Unit #"/><TH c="VIN"/><TH c="Date"/><TH c="Status"/><TH c=""/></tr></thead>
          <tbody>{list.length===0?<tr><td colSpan={7} style={{textAlign:"center",padding:40,color:"#aaa"}}>No appointments</td></tr>:list.map((a,i)=>(
            <tr key={a.id} style={{background:i%2===0?"#fff":"#fafafa"}}>
              <td style={{padding:"12px 16px",fontSize:13,borderBottom:"1px solid #f5f5f5"}}>{i+1}</td>
              <td style={{padding:"12px 16px",fontSize:13,borderBottom:"1px solid #f5f5f5"}}><strong>{a.company}</strong></td>
              <td style={{padding:"12px 16px",fontSize:13,borderBottom:"1px solid #f5f5f5"}}>{a.unit_number}</td>
              <td style={{padding:"12px 16px",fontSize:12,borderBottom:"1px solid #f5f5f5",fontFamily:"monospace"}}>{a.vin}</td>
              <td style={{padding:"12px 16px",fontSize:13,borderBottom:"1px solid #f5f5f5"}}>{a.date}</td>
              <td style={{padding:"12px 16px",borderBottom:"1px solid #f5f5f5"}}><Badge s={a.status}/></td>
              <td style={{padding:"12px 16px",borderBottom:"1px solid #f5f5f5"}}><button onClick={()=>del(a.id)} style={{background:"none",border:"none",cursor:"pointer",color:"#e74c3c"}}>🗑</button></td>
            </tr>
          ))}</tbody>
        </table>
      </div>
      {modal&&(
        <Modal title="New Appointment" onClose={()=>setModal(false)}>
          <Field label="Company" value={form.company} onChange={v=>setForm(p=>({...p,company:v}))} options={["",...customers.map(c=>c.name)]} searchable placeholder="Search customer…" required/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <Field label="Unit Number" value={form.unit_number} onChange={v=>setForm(p=>({...p,unit_number:v}))}/>
            <Field label="VIN" value={form.vin} onChange={v=>setForm(p=>({...p,vin:v}))}/>
            <Field label="Date" value={form.date} onChange={v=>setForm(p=>({...p,date:v}))} type="date"/>
            <Field label="Status" value={form.status} onChange={v=>setForm(p=>({...p,status:v}))} options={["Scheduled","Pending","Done","Cancelled"]}/>
          </div>
          <div style={{display:"flex",justifyContent:"flex-end",gap:10,marginTop:8}}>
            <button onClick={()=>setModal(false)} style={{padding:"10px 18px",background:"#f0f0f0",border:"none",borderRadius:8,cursor:"pointer"}}>Cancel</button>
            <button onClick={()=>guard(add)} style={{padding:"10px 18px",background:"#c0392b",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:600}}>Add</button>
          </div>
        </Modal>
      )}
    </div>
  );
};

// ─── REMINDERS PAGE ───────────────────────────────────────────────────────────
const RemindersPage = () => {
  const user = useContext(UserCtx);
  const vp = useViewport();
  const guard = useOnce();
  const [list,setList]=useState([]);
  const [customers,setCustomers]=useState([]);
  const [equipment,setEquipment]=useState([]);
  const [workOrders,setWorkOrders]=useState([]);
  const [loading,setLoading]=useState(true);
  const [filter,setFilter]=useState("pending");
  const [sortBy,setSortBy]=useState(null);
  const [sortDir,setSortDir]=useState("asc");
  const [modal,setModal]=useState(false);
  const [editId,setEditId]=useState(null);
  const EMPTY={customer_name:"",equipment_id:"",work_order_id:"",reminder_date:"",note:"",kind:"reminder"};
  const [form,setForm]=useState(EMPTY);

  const load=async()=>{
    const [rr,cr,er,wr]=await Promise.all([
      sb.from('reminders').select('*').order('created_at',{ascending:false}),
      sb.from('customers').select('id,name').order('name'),
      sb.from('equipment').select('*'),
      sb.from('work_orders').select('id,customer,unit_number,is_voided').eq('is_voided',false)
    ]);
    setList(rr.data||[]); setCustomers(cr.data||[]); setEquipment(er.data||[]); setWorkOrders(wr.data||[]); setLoading(false);
  };
  useEffect(()=>{load();},[]);

  const today=todayLocal();
  const statusOf=r=>r.completed?"completed":(r.reminder_date&&r.reminder_date<today)?"overdue":"pending";
  const filtered=list.filter(r=>filter==="all"?true:filter==="pending"?!r.completed:filter==="overdue"?statusOf(r)==="overdue":r.completed);

  const sortVal=(r,k)=>{
    if(k==="customer") return (r.customer_name||"").toLowerCase();
    if(k==="source") return (r.equipment_label||r.work_order_id||"").toLowerCase();
    if(k==="due") return r.reminder_date||"9999-99-99";
    if(k==="note") return (r.note||"").toLowerCase();
    if(k==="created") return r.created_at||"";
    if(k==="by") return (r.created_by||"").toLowerCase();
    if(k==="status") return statusOf(r);
    return "";
  };
  const cmp=(a,b)=>a<b?-1:a>b?1:0;
  const sorted=sortBy
    ? [...filtered].sort((a,b)=>{const r=cmp(sortVal(a,sortBy),sortVal(b,sortBy));return sortDir==="asc"?r:-r;})
    : [...filtered].sort((a,b)=>cmp(b.created_at||"",a.created_at||""));
  const onSort=k=>{
    if(sortBy!==k){setSortBy(k);setSortDir("asc");}
    else if(sortDir==="asc") setSortDir("desc");
    else setSortBy(null);
  };
  const sortArrow=k=>sortBy===k?(sortDir==="asc"?" ↑":" ↓"):"";

  const openAdd=()=>{setForm(EMPTY);setEditId(null);setModal(true);};
  const openEdit=r=>{setForm({customer_name:r.customer_name||"",equipment_id:r.equipment_id?String(r.equipment_id):"",work_order_id:r.work_order_id||"",reminder_date:r.reminder_date||"",note:r.note||"",kind:r.kind||"reminder"});setEditId(r.id);setModal(true);};
  const closeModal=()=>{setModal(false);setEditId(null);setForm(EMPTY);};
  const save=async()=>{
    if(!form.customer_name||!form.note.trim()){alert("Customer and note are required.");return;}
    const eqId=form.equipment_id?Number(form.equipment_id):null;
    const eqRow=eqId?equipment.find(e=>e.id===eqId):null;
    const label=eqRow?`${eqRow.year||""} ${eqRow.make||""} ${eqRow.model||eqRow.type||""}`.trim()+(eqRow.unit_number?` · #${eqRow.unit_number}`:"")+(eqRow.vin?` · ${eqRow.vin}`:""):(form.work_order_id?`WO ${form.work_order_id}`:form.customer_name);
    // Tasks are undated by design — editing one here must not give it a due date.
    const payload={customer_name:form.customer_name,equipment_id:eqId,equipment_label:label.trim(),work_order_id:form.work_order_id||null,reminder_date:form.kind==='task'?null:(form.reminder_date||null),note:form.note.trim(),created_by:user.name};
    if(editId){
      const res=await sb.from('reminders').update(payload).eq('id',editId);
      if(res.error){alert("Could not save: "+res.error.message);return;}
      audit(user,"update","reminder",editId,`${form.customer_name} — ${payload.equipment_label}`,payload.note.slice(0,120));
    }else{
      const {data:inserted,error}=await sb.from('reminders').insert([payload]).select().single();
      if(error){alert("Could not create: "+error.message);return;}
      audit(user,"create","reminder",inserted?.id,`${form.customer_name} — ${payload.equipment_label}`,payload.note.slice(0,120));
    }
    closeModal();load();bumpReminders(); // a new/edited due date can change the overdue count
  };
  const complete=async(id)=>{
    const prev=list.find(r=>r.id===id);
    const r=await must(sb.from('reminders').update({completed:true}).eq('id',id).eq('completed',false).select(),"Could not complete reminder");
    if(!r)return;
    if(r.data&&r.data.length){
      audit(user,"status_change","reminder",id,`${prev?.customer_name||""} — ${prev?.equipment_label||""}`,`completed: false → true`);
      await rescheduleAutoReminder(user,prev);
    }
    load();bumpReminders();
  };
  const del=async(id)=>{
    if(!confirm("Delete reminder?"))return;
    const prev=list.find(r=>r.id===id);
    const r=await must(sb.from('reminders').delete().eq('id',id),"Could not delete reminder");
    if(!r)return;
    audit(user,"delete","reminder",id,`${prev?.customer_name||""} — ${prev?.equipment_label||""}`);
    load();bumpReminders();
  };

  const selectedCust=customers.find(c=>c.name===form.customer_name);
  const equipForCustomer=selectedCust?equipment.filter(e=>e.customer_id===selectedCust.id):[];
  const wosForCustomer=form.customer_name?workOrders.filter(w=>w.customer===form.customer_name):[];

  if(loading) return <Loading/>;
  const th=(k,label)=>(<th onClick={()=>onSort(k)} style={{textAlign:"left",padding:"10px 14px",fontSize:11,fontWeight:700,color:sortBy===k?"#c0392b":"#666",letterSpacing:1,textTransform:"uppercase",borderBottom:"2px solid #f0f0f0",cursor:"pointer",userSelect:"none",whiteSpace:"nowrap"}} title="Click to sort">{label}{sortArrow(k)}</th>);

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <h1 style={{margin:0,fontSize:26,fontWeight:800,color:"#1a1a2e"}}>Reminders</h1>
        <Btn label="Create reminder" onClick={openAdd} color="#c0392b" icon="🔔"/>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:14,alignItems:"center",flexWrap:"wrap"}}>
        {[["pending","Pending"],["overdue","Overdue 🔴"],["completed","Completed"],["all","All"]].map(([k,l])=>(
          <button key={k} onClick={()=>setFilter(k)} style={{padding:"8px 16px",background:filter===k?"#1a1a2e":"#f0f0f0",color:filter===k?"#fff":"#555",border:"none",borderRadius:20,cursor:"pointer",fontSize:13,fontWeight:filter===k?700:400}}>{l}</button>
        ))}
        {sortBy&&<button onClick={()=>setSortBy(null)} style={{padding:"7px 14px",background:"#fff",color:"#c0392b",border:"1px solid #c0392b",borderRadius:20,cursor:"pointer",fontSize:12,fontWeight:600}}>↺ Reset sort</button>}
      </div>
      {vp.isMobile?(
        <div>
          {sorted.length===0?<div style={{padding:30,textAlign:"center",color:"#aaa",background:"#fff",borderRadius:12,boxShadow:"0 2px 12px rgba(0,0,0,0.06)"}}>No reminders.</div>:sorted.map(r=>{
            const st=statusOf(r);
            const stColor=st==="completed"?"#27ae60":st==="overdue"?"#c0392b":"#d4ac0d";
            const stLabel=st==="completed"?"Completed":st==="overdue"?"Overdue":"Pending";
            const source=r.work_order_id?`WO ${r.work_order_id}`:(r.equipment_label||"");
            return (
              <div key={r.id} style={{background:"#fff",borderRadius:12,padding:14,marginBottom:10,boxShadow:"0 2px 8px rgba(0,0,0,0.06)",border:`1px solid ${st==="overdue"?"#f5c6cb":"#eee"}`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,marginBottom:6}}>
                  <div style={{fontWeight:700,fontSize:14}}>{r.customer_name}</div>
                  <span style={{padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:700,background:stColor+"18",color:stColor,whiteSpace:"nowrap"}}>{stLabel}</span>
                </div>
                <div style={{fontSize:14,color:r.completed?"#888":"#1a1a2e",textDecoration:r.completed?"line-through":"",marginBottom:6}}>{r.note}</div>
                <div style={{fontSize:12,color:"#888",marginBottom:10,display:"flex",flexWrap:"wrap",gap:8}}>
                  {r.kind==='task'&&<span style={{padding:"2px 8px",borderRadius:10,fontSize:10,fontWeight:700,background:"#fef9e7",color:"#9a7d0a"}}>📋 TASK</span>}
                  {source&&<span>📋 {source}</span>}
                  {r.reminder_date&&<span>📅 Due {fmtDay(r.reminder_date)}</span>}
                  <span>👤 {r.created_by||"—"}</span>
                </div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  {!r.completed&&<button onClick={()=>complete(r.id)} style={{flex:1,padding:"9px 12px",background:"#27ae60",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600,minHeight:44}}>✓ Done</button>}
                  <button onClick={()=>openEdit(r)} style={{flex:1,padding:"9px 12px",background:"#1a1a2e",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,minHeight:44}}>✏️ Edit</button>
                  <button onClick={()=>del(r.id)} style={{flex:0,padding:"9px 14px",background:"#fdecea",color:"#c0392b",border:"none",borderRadius:8,cursor:"pointer",fontSize:14,minHeight:44}}>🗑</button>
                </div>
              </div>
            );
          })}
        </div>
      ):(
      <div style={{background:"#fff",borderRadius:12,overflow:"auto",boxShadow:"0 2px 12px rgba(0,0,0,0.06)"}}>
        <table style={{width:"100%",borderCollapse:"collapse",minWidth:900}}>
          <thead><tr>
            {th("customer","Customer")}
            {th("source","Source")}
            {th("due","Due")}
            {th("note","Note")}
            {th("created","Created")}
            {th("by","By")}
            {th("status","Status")}
            <th style={{padding:"10px 14px"}}></th>
          </tr></thead>
          <tbody>
            {sorted.length===0?<tr><td colSpan={8} style={{textAlign:"center",padding:40,color:"#aaa"}}>No reminders.</td></tr>:sorted.map((r,i)=>{
              const st=statusOf(r);
              const stColor=st==="completed"?"#27ae60":st==="overdue"?"#c0392b":"#d4ac0d";
              const stLabel=st==="completed"?"Completed":st==="overdue"?"Overdue":"Pending";
              const source=(r.kind==='task'?'📋 TASK · ':'')+(r.work_order_id?`WO ${r.work_order_id}`:(r.equipment_label||"—"));
              return (
                <tr key={r.id} style={{background:i%2===0?"#fff":"#fafafa"}}>
                  <td style={{padding:"10px 14px",fontSize:13,borderBottom:"1px solid #f5f5f5",fontWeight:600}}>{r.customer_name}</td>
                  <td style={{padding:"10px 14px",fontSize:12,borderBottom:"1px solid #f5f5f5",color:"#555"}}>{source}</td>
                  <td style={{padding:"10px 14px",fontSize:12,borderBottom:"1px solid #f5f5f5",whiteSpace:"nowrap"}}>{r.reminder_date?fmtDay(r.reminder_date):"—"}</td>
                  <td style={{padding:"10px 14px",fontSize:13,borderBottom:"1px solid #f5f5f5",color:r.completed?"#888":"#1a1a2e",textDecoration:r.completed?"line-through":""}}>{r.note}</td>
                  <td style={{padding:"10px 14px",fontSize:11,borderBottom:"1px solid #f5f5f5",color:"#888",whiteSpace:"nowrap"}}>{r.created_at?fmtDate(r.created_at):"—"}</td>
                  <td style={{padding:"10px 14px",fontSize:12,borderBottom:"1px solid #f5f5f5"}}>{r.created_by||"—"}</td>
                  <td style={{padding:"10px 14px",borderBottom:"1px solid #f5f5f5"}}>
                    <span style={{padding:"2px 9px",borderRadius:20,fontSize:11,fontWeight:700,background:stColor+"18",color:stColor,whiteSpace:"nowrap"}}>{stLabel}</span>
                  </td>
                  <td style={{padding:"10px 14px",borderBottom:"1px solid #f5f5f5",whiteSpace:"nowrap",textAlign:"right"}}>
                    {!r.completed&&<button onClick={()=>complete(r.id)} title="Mark done" style={{padding:"5px 9px",background:"#27ae60",color:"#fff",border:"none",borderRadius:5,cursor:"pointer",fontSize:11,fontWeight:600,marginRight:4,minWidth:36}}>✓</button>}
                    <button onClick={()=>openEdit(r)} title="Edit" style={{padding:"5px 9px",background:"#1a1a2e",color:"#fff",border:"none",borderRadius:5,cursor:"pointer",fontSize:11,marginRight:4,minWidth:36}}>✏️</button>
                    <button onClick={()=>del(r.id)} title="Delete" style={{padding:"5px 9px",background:"#fdecea",color:"#c0392b",border:"none",borderRadius:5,cursor:"pointer",fontSize:11,minWidth:36}}>🗑</button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      )}
      {modal&&(
        <Modal title={editId?"Edit Reminder":"Create Reminder"} onClose={closeModal}>
          <Field label="Customer" value={form.customer_name} onChange={v=>setForm(p=>({...p,customer_name:v,equipment_id:"",work_order_id:""}))} options={["",...customers.map(c=>c.name)]} searchable placeholder="Search customer…" required/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <div style={{marginBottom:14}}>
              <label style={{display:"block",fontSize:13,fontWeight:600,color:"#555",marginBottom:5}}>Equipment (optional)</label>
              <select value={form.equipment_id} onChange={e=>setForm(p=>({...p,equipment_id:e.target.value}))} disabled={!form.customer_name} style={{width:"100%",padding:"9px 12px",border:"1px solid #ddd",borderRadius:8,fontSize:14,background:"#fff"}}>
                <option value="">— None —</option>
                {equipForCustomer.map(e=>{const lbl=`${e.year||""} ${e.make||""} ${e.model||e.type||""}`.trim()+(e.unit_number?` · #${e.unit_number}`:"")+(e.vin?` · ${e.vin}`:""); return <option key={e.id} value={String(e.id)}>{lbl||`Equipment ${e.id}`}</option>;})}
              </select>
            </div>
            <div style={{marginBottom:14}}>
              <label style={{display:"block",fontSize:13,fontWeight:600,color:"#555",marginBottom:5}}>Work Order (optional)</label>
              <select value={form.work_order_id} onChange={e=>setForm(p=>({...p,work_order_id:e.target.value}))} disabled={!form.customer_name} style={{width:"100%",padding:"9px 12px",border:"1px solid #ddd",borderRadius:8,fontSize:14,background:"#fff"}}>
                <option value="">— None —</option>
                {wosForCustomer.map(w=><option key={w.id} value={w.id}>{w.id}{w.unit_number?` · Unit ${w.unit_number}`:""}</option>)}
              </select>
            </div>
          </div>
          {form.kind!=='task'&&<Field label="Due date" value={form.reminder_date} onChange={v=>setForm(p=>({...p,reminder_date:v}))} type="date"/>}
          <Field label="Note" value={form.note} onChange={v=>setForm(p=>({...p,note:v}))} type="textarea" required placeholder="e.g. DOT inspection due, call for oil change..."/>
          <div style={{display:"flex",justifyContent:"flex-end",gap:10}}>
            <button onClick={closeModal} style={{padding:"10px 18px",background:"#f0f0f0",border:"none",borderRadius:8,cursor:"pointer"}}>Cancel</button>
            <button onClick={()=>guard(save)} style={{padding:"10px 18px",background:"#c0392b",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:600}}>{editId?"Save Changes":"Create"}</button>
          </div>
        </Modal>
      )}
    </div>
  );
};

// ─── EMPLOYEES ────────────────────────────────────────────────────────────────
const EmployeesPage = () => {
  const [tab,setTab]=useState("active");
  const [list,setList]=useState([]); const [loading,setLoading]=useState(true);
  const load=async()=>{const{data}=await sb.from('users').select('*').order('created_at');setList(data||[]);setLoading(false);};
  useEffect(()=>{load();},[]);
  if(loading) return <Loading/>;
  const active=list.filter(u=>u.active); const fired=list.filter(u=>!u.active);
  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <h1 style={{margin:0,fontSize:26,fontWeight:800,color:"#1a1a2e"}}>Employees</h1>
      </div>
      <div style={{display:"flex",marginBottom:20,borderBottom:"2px solid #f0f0f0"}}>
        {["active","fired"].map(t=><button key={t} onClick={()=>setTab(t)} style={{padding:"10px 20px",background:"none",border:"none",cursor:"pointer",fontSize:14,fontWeight:tab===t?700:400,color:tab===t?"#c0392b":"#888",borderBottom:tab===t?"2px solid #c0392b":"2px solid transparent",marginBottom:-2}}>{t==="active"?"Active":"Fired"}</button>)}
      </div>
      <div style={{background:"#fff",borderRadius:12,padding:24,boxShadow:"0 2px 12px rgba(0,0,0,0.06)"}}>
        {(tab==="active"?active:fired).map(e=>(
          <div key={e.id} style={{border:"1px solid #eee",borderRadius:10,padding:16,marginBottom:12}}>
            <div style={{display:"flex",alignItems:"center",gap:14}}>
              <div style={{width:44,height:44,background:"linear-gradient(135deg,#c0392b,#e74c3c)",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:16}}>{e.name.charAt(0)}</div>
              <div><div style={{fontWeight:700,fontSize:15}}>{e.name}</div><div style={{fontSize:13,color:"#888"}}>{e.role}</div><div style={{fontSize:13,color:"#555"}}>✉️ {e.email}</div></div>
            </div>
          </div>
        ))}
        {(tab==="active"?active:fired).length===0&&<div style={{textAlign:"center",padding:40,color:"#aaa"}}>None.</div>}
      </div>
    </div>
  );
};

// ─── SETTINGS ────────────────────────────────────────────────────────────────
const Settings = () => {
  const currentUser = useContext(UserCtx);
  const guard = useOnce();
  const [users,setUsers]=useState([]); const [loading,setLoading]=useState(true);
  const [modal,setModal]=useState(false);
  const [form,setForm]=useState({name:"",email:"",password:"",role:"mechanic"});
  const load=async()=>{const{data}=await sb.from('users').select('*').order('created_at');setUsers(data||[]);setLoading(false);};
  useEffect(()=>{load();},[]);
  const add=async()=>{
    if(!form.name||!form.email||!form.password) return;
    const {data:inserted,error}=await sb.from('users').insert([{...form,active:true}]).select().single();
    if(error){alert("Could not add user: "+error.message);return;}
    audit(currentUser,"create","user",inserted?.id,form.name,`email: ${form.email}, role: ${form.role}`);
    setModal(false);setForm({name:"",email:"",password:"",role:"mechanic"});load();
  };
  const toggleActive=async(u)=>{
    const r=await must(sb.from('users').update({active:!u.active}).eq('id',u.id),"Could not update user");
    if(!r)return;
    audit(currentUser,"status_change","user",u.id,u.name,`active: ${u.active} → ${!u.active}`);

const escHtml = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const csvCell = v => { const s=String(v??""); return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
const toCSV = rows => rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
const downloadFile = (name,content,type) => { const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>{try{URL.revokeObjectURL(url);}catch(_){}},1000); };
const RANGE_OPTS = [["today","Today"],["yesterday","Yesterday"],["this-week","This week"],["last-week","Last week"],["this-month","This month"],["last-month","Last month"],["last-30","Last 30 days"],["this-quarter","This quarter"],["last-quarter","Last quarter"],["last-3-months","Last 3 months"],["last-6-months","Last 6 months"],["last-12-months","Last 12 months"],["ytd","Year to date"],["custom","Custom range…"]];
// Inclusive {start,end} YYYY-MM-DD for a named range. Month/quarter math relies on JS Date normalization.
const dateRangeFor = (key,custom) => {
  const now=new Date(), Y=now.getFullYear(), M=now.getMonth(), D=now.getDate();
  const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const mk=(y,m,d)=>new Date(y,m,d), today=mk(Y,M,D), dow=(today.getDay()+6)%7, q=Math.floor(M/3);
  const fmt=(a,b)=>({start:ymd(a),end:ymd(b)});
  switch(key){
    case "today": return fmt(today,today);
    case "yesterday": {const y=mk(Y,M,D-1);return fmt(y,y);}
    case "this-week": return fmt(mk(Y,M,D-dow),today);
    case "last-week": return fmt(mk(Y,M,D-dow-7),mk(Y,M,D-dow-1));
    case "this-month": return fmt(mk(Y,M,1),today);
    case "last-month": return fmt(mk(Y,M-1,1),mk(Y,M,0));
    case "last-30": return fmt(mk(Y,M,D-29),today);
    case "this-quarter": return fmt(mk(Y,q*3,1),today);
    case "last-quarter": return fmt(mk(Y,(q-1)*3,1),mk(Y,q*3,0));
    case "last-3-months": return fmt(mk(Y,M-3,D),today);
    case "last-6-months": return fmt(mk(Y,M-6,D),today);
    case "last-12-months": return fmt(mk(Y,M-12,D),today);
    case "ytd": return fmt(mk(Y,0,1),today);
    case "custom": return {start:(custom&&custom.start)||"",end:(custom&&custom.end)||""};
    default: return fmt(mk(Y,M,1),today);
  }
};

// make/model/year (from the equipment record, else decoded from the VIN) so mechanics can look
// up "what part numbers did we use on this kind of truck before." Reads the parts_catalog view.
const PartsReference = () => {
  const vp = useViewport();
  const [rows,setRows]=useState([]); const [loading,setLoading]=useState(true); const [q,setQ]=useState("");
  useEffect(()=>{sb.from('parts_catalog').select('*').then(({data})=>{setRows(data||[]);setLoading(false);});},[]);
  if(loading) return <Loading/>;
  const ql=q.trim().toLowerCase();
  const hit=r=>!ql||[r.make,r.model,r.year,r.vin,r.unit_number,r.part_name,r.part_number,r.customer].some(v=>String(v||"").toLowerCase().includes(ql));
  const filtered=rows.filter(hit);
  // Group by truck type (year make model); rows with no make fall into a "by VIN/unit" bucket.
  const groups={};
  filtered.forEach(r=>{
    const truck=(r.make||"")?`${r.year||""} ${r.make||""} ${r.model||""}`.replace(/\s+/g," ").trim():(r.vin?`VIN ${r.vin}`:(r.unit_number?`Unit ${r.unit_number}`:"Unidentified truck"));
    const g=groups[truck]||(groups[truck]={truck,hasMake:!!r.make,parts:{}});
    const key=`${(r.part_name||"").toLowerCase()}|${(r.part_number||"").toLowerCase()}`;
    const p=g.parts[key]||(g.parts[key]={name:r.part_name||"—",number:r.part_number||"",count:0,last:"",lastWo:"",units:new Set()});
    p.count++; if(r.unit_number)p.units.add(r.unit_number);
    if(String(r.wo_date||"")>String(p.last)){p.last=r.wo_date||"";p.lastWo=r.work_order_id||"";}
  });
  const list=Object.values(groups).map(g=>({...g,parts:Object.values(g.parts).sort((a,b)=>a.name.localeCompare(b.name))}))
    .sort((a,b)=>(b.hasMake-a.hasMake)||a.truck.localeCompare(b.truck));
  return (
    <div>
      <div style={{marginBottom:6}}><h1 style={{margin:0,fontSize:26,fontWeight:800,color:"#1a1a2e"}}>Parts Reference</h1></div>

        <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:"#aaa"}}>🔍</span>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search make, model, year, VIN, part name or number…" style={{width:"100%",padding:"11px 12px 11px 36px",border:"1px solid #ddd",borderRadius:10,fontSize:14}}/>
      </div>
      {list.length===0?<div style={{padding:30,textAlign:"center",color:"#aaa",background:"#fff",borderRadius:12,boxShadow:"0 2px 12px rgba(0,0,0,0.06)"}}>No parts found.</div>:list.map(g=>(
        <div key={g.truck} style={{background:"#fff",borderRadius:12,boxShadow:"0 2px 12px rgba(0,0,0,0.06)",marginBottom:16,overflow:"hidden"}}>
          <div style={{padding:"12px 16px",borderBottom:"1px solid #f0f0f0",display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <span style={{fontWeight:800,fontSize:15,color:"#1a1a2e"}}>🚛 {g.truck}</span>
            <span style={{fontSize:12,color:"#888"}}>{g.parts.length} part{g.parts.length>1?"s":""}</span>
          </div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",minWidth:560,fontSize:13}}>
              <thead><tr>{["Part","Part #","Units","Times","Last used","Last WO"].map((c,i)=><th key={c} style={{textAlign:i>=2&&i<=3?"right":"left",padding:"8px 14px",fontSize:11,fontWeight:700,color:"#888",letterSpacing:0.5,textTransform:"uppercase",borderBottom:"2px solid #f5f5f5",whiteSpace:"nowrap"}}>{c}</th>)}</tr></thead>
              <tbody>{g.parts.map((p,i)=>(
                <tr key={p.name+p.number+i} style={{background:i%2?"#fafafa":"#fff"}}>
                  <td style={{padding:"8px 14px",borderBottom:"1px solid #f5f5f5"}}>{p.name}</td>
                  <td style={{padding:"8px 14px",borderBottom:"1px solid #f5f5f5",fontFamily:"monospace",fontWeight:700,color:p.number?"#c0392b":"#bbb"}}>{p.number||"— none —"}</td>
                  <td style={{padding:"8px 14px",borderBottom:"1px solid #f5f5f5",textAlign:"right",color:"#666",whiteSpace:"nowrap"}}>{[...p.units].join(", ")||"—"}</td>

// ─── AUDIT LOG ────────────────────────────────────────────────────────────────
const AuditLog = () => {
  const currentUser = useContext(UserCtx);
  const [logs,setLogs] = useState([]);
  const [users,setUsers] = useState([]);
  const [loading,setLoading] = useState(true);
  const [hasMore,setHasMore] = useState(false);
  const [filters,setFilters] = useState({user_id:"",entity_type:"",action:"",from:"",to:""});
  const PAGE = 100;

  const reqId = React.useRef(0);

  const buildQuery = (append) => {
    let q = sb.from('audit_log').select('*').order('created_at',{ascending:false}).order('id',{ascending:false}).limit(PAGE+1);
    if(filters.user_id) q = q.eq('user_id', filters.user_id);
    if(filters.entity_type) q = q.eq('entity_type', filters.entity_type);
    if(filters.action) q = q.eq('action', filters.action);
    if(filters.from) q = q.gte('created_at', filters.from);
    if(filters.to) q = q.lte('created_at', filters.to+'T23:59:59');
    if(append && logs.length>0){
      // Keyset on (created_at, id): bulk actions log several rows in the same
      // millisecond, so paging on created_at alone skipped boundary rows.
      const last = logs[logs.length-1];
      q = q.or(`created_at.lt.${last.created_at},and(created_at.eq.${last.created_at},id.lt.${last.id})`);
    }
    return q;
  };

  const load = async (append=false) => {
    const my = ++reqId.current;
    setLoading(true);
    const {data} = await buildQuery(append);
    if(my !== reqId.current) return; // a newer load (filter change) superseded this one
    const got = data || [];
    setHasMore(got.length > PAGE);
    const trimmed = got.slice(0, PAGE);
    setLogs(append ? [...logs, ...trimmed] : trimmed);
    setLoading(false);
  };

  useEffect(() => { sb.from('users').select('id,name').order('name').then(({data})=>setUsers(data||[])); }, []);
  useEffect(() => { load(false); /* eslint-disable-next-line */ }, [filters]);

  if(currentUser.role !== "admin") return <div style={{padding:40,textAlign:"center",color:"#888"}}>⛔ Admin access only.</div>;

  const actionColors = {create:"#27ae60",update:"#3498db",delete:"#e74c3c",status_change:"#8e44ad"};
  const clearFilters = () => setFilters({user_id:"",entity_type:"",action:"",from:"",to:""});

// Persist the logged-in user across refresh. Password is stripped before storing —
// the rest (id, name, email, role, active) is enough to drive the app and avoids
// putting plaintext passwords in localStorage.
const SESSION_KEY = 'lincoln_tms_user';
const loadSession = () => {
  try { const raw = typeof localStorage !== 'undefined' && localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; }
  catch { return null; }
};
const saveSession = (u) => {
  try {
    if (!u) { localStorage.removeItem(SESSION_KEY); return; }
    const { password, ...safe } = u;
    localStorage.setItem(SESSION_KEY, JSON.stringify(safe));
  } catch {}
};

// ─── SIGNATURE PAD + MY SIGNATURE PAGE ────────────────────────────────────────
// Draw-once signature, saved to the user's profile (users.signature, a PNG data URL),
// stamped onto DOT printouts by printDot.
const SignaturePad = ({onSave}) => {
  const ref=React.useRef(null); const drawing=React.useRef(false); const last=React.useRef(null);
  const [dirty,setDirty]=useState(false);
  const ctx=()=>ref.current.getContext("2d");
  const pos=e=>{ const c=ref.current,r=c.getBoundingClientRect(); return {x:(e.clientX-r.left)*(c.width/r.width), y:(e.clientY-r.top)*(c.height/r.height)}; };
  const down=e=>{ e.preventDefault(); try{ref.current.setPointerCapture(e.pointerId);}catch(_){} drawing.current=true; last.current=pos(e); };
  const move=e=>{ if(!drawing.current)return; e.preventDefault(); const p=pos(e),g=ctx(); g.strokeStyle="#1a1a2e";g.lineWidth=2.5;g.lineCap="round";g.lineJoin="round"; g.beginPath();g.moveTo(last.current.x,last.current.y);g.lineTo(p.x,p.y);g.stroke(); last.current=p; if(!dirty)setDirty(true); };
  const up=()=>{ drawing.current=false; };
  const clear=()=>{ const c=ref.current; ctx().clearRect(0,0,c.width,c.height); setDirty(false); };
  const save=()=>{ if(!dirty){alert("Draw your signature first.");return;} onSave(ref.current.toDataURL("image/png")); };
  return (
    <div>
      <canvas ref={ref} width={500} height={180} onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerLeave={up}
        style={{width:"100%",maxWidth:500,height:180,border:"1px dashed #c0392b",borderRadius:10,background:"#fff",touchAction:"none",cursor:"crosshair",display:"block"}}/>
      <div style={{display:"flex",gap:8,marginTop:10}}>
        <button onClick={clear} style={{padding:"10px 18px",background:"#f0f0f0",border:"none",borderRadius:8,cursor:"pointer",fontSize:14}}>Clear</button>
        <button onClick={save} style={{padding:"10px 18px",background:"#c0392b",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:14}}>💾 Save signature</button>
      </div>
    </div>
  );
};
const MySignature = () => {
  const user=useContext(UserCtx);
  const [sig,setSig]=useState(""); const [loading,setLoading]=useState(true); const [saved,setSaved]=useState(false);
  useEffect(()=>{ sb.from('users').select('signature').eq('id',user.id).maybeSingle().then(({data})=>{ setSig((data&&data.signature)||""); setLoading(false); }); },[]);
  const onSave=async(dataUrl)=>{
    const r=await must(sb.from('users').update({signature:dataUrl}).eq('id',user.id),"Could not save signature");
    if(!r)return;
    setSig(dataUrl); setSaved(true); setTimeout(()=>setSaved(false),2500);
  };
  const remove=async()=>{ if(!confirm("Remove your saved signature?"))return; const r=await must(sb.from('users').update({signature:null}).eq('id',user.id),"Could not remove signature"); if(!r)return; setSig(""); };
  if(loading) return <Loading/>;
  return (
    <div>
      <h1 style={{margin:"0 0 6px",fontSize:26,fontWeight:800,color:"#1a1a2e"}}>My Signature</h1>
      <p style={{margin:"0 0 18px",color:"#888",fontSize:13}}>Sign once here and it auto-applies to the bottom of any DOT inspection form <strong>you</strong> print.</p>
      <div style={{background:"#fff",borderRadius:12,padding:20,boxShadow:"0 2px 12px rgba(0,0,0,0.06)",maxWidth:560}}>
        {sig&&<div style={{marginBottom:18}}>
          <div style={{fontSize:12,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:0.5,marginBottom:6}}>Current signature</div>
          <img src={sig} alt="signature" style={{maxWidth:300,maxHeight:90,border:"1px solid #eee",borderRadius:8,background:"#fff",padding:6}}/>
          <div><button onClick={remove} style={{marginTop:8,padding:"6px 12px",background:"#fdecea",color:"#c0392b",border:"none",borderRadius:6,cursor:"pointer",fontSize:12,fontWeight:600}}>Remove</button></div>
        </div>}
        <div style={{fontSize:13,fontWeight:600,color:"#555",marginBottom:8}}>{sig?"Draw a new signature to replace it:":"Draw your signature:"}</div>
        <SignaturePad onSave={onSave}/>
        {saved&&<div style={{marginTop:12,color:"#1e8449",fontWeight:700,fontSize:14}}>✓ Signature saved</div>}
      </div>
    </div>
  );
};

const App = () => {
  const [user,setUserState]=useState(loadSession);
  const setUser = u => { saveSession(u); setUserState(u); };
  const [page,setPage]=useState("dashboard");
  // mode: shop (mechanic-style trimmed nav) vs full. Mechanics on tablets default to shop; everyone else defaults to full.
  const [mode,setMode]=useState("shop");
  const [refreshKey,setRefreshKey]=useState(0);
  const [refreshing,setRefreshing]=useState(false);
  const [overdueReminders,setOverdueReminders]=useState(0);
  // Bump the key on the rendered page so its component remounts and useEffects re-fire,
  // pulling fresh data without affecting nav, scroll, or open modals on OTHER pages.
  const onRefresh = () => { setRefreshing(true); setRefreshKey(k => k + 1); setTimeout(() => setRefreshing(false), 450); };
  const vp = useViewport();
  const isMech = user?.role === "mechanic";
  const shopActive = !!user && isMech && mode === "shop" && !vp.isDesktop;
  const activeNav = (shopActive ? NAV.filter(n=>n.shop) : NAV).filter(n=>!n.admin || user?.role==="admin");
  // Guard: if mechanic flips to shop view while on a hidden page, drop back to a shop-visible one.
  // Must be declared before any early return to keep hook order stable.
  useEffect(()=>{
    if(shopActive && !activeNav.some(n=>n.id===page)) setPage(activeNav[0]?.id || "workorders");
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[shopActive]);
  // Overdue-reminder count for the nav badge. Refetches on navigation/refresh and whenever
  // a reminder is resolved/edited (the 'reminders-changed' event) — so it only drops when the
  // underlying overdue set actually shrinks, not just from viewing.
  useEffect(()=>{
    if(!user) return;
    let alive=true;
    const fetchOverdue=()=>sb.from('reminders').select('id',{count:'exact',head:true}).eq('completed',false).lt('reminder_date',todayLocal()).then(({count})=>{ if(alive) setOverdueReminders(count||0); });
    fetchOverdue();
    window.addEventListener('reminders-changed',fetchOverdue);
    return ()=>{ alive=false; window.removeEventListener('reminders-changed',fetchOverdue); };
  },[user,page,refreshKey]);
  // Re-validate the restored session on load — without this a deactivated employee's
  // tablet stays logged in (with their old role) until they voluntarily log out.
  useEffect(()=>{
    const u=loadSession();
    if(!u?.id) return;
    sb.from('users').select('id,name,email,role,active').eq('id',u.id).maybeSingle().then(({data,error})=>{
      if(error) return; // offline — keep the session rather than locking the shop out
      if(!data||!data.active) setUser(null);
      else if(data.role!==u.role||data.name!==u.name||data.email!==u.email) setUser(data);
    });
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[]);
  if(!user) return <Login onLogin={setUser}/>;
  const pages = {
    dashboard:<Dashboard onNav={setPage}/>,workorders:<WorkOrders/>,customers:<Customers/>,
    appointments:<Appointments/>,reminders:<RemindersPage/>,employees:<EmployeesPage/>,
    salaries:<Salaries/>,inventory:<Inventory/>,orderparts:<OrderParts/>,partsref:<PartsReference/>,mysig:<MySignature/>,reports:<Reports/>,
    invoices:<Invoices/>,estimates:<Estimates/>,auditlog:<AuditLog/>,settings:<Settings/>,
  };
  const canToggleMode = isMech && !vp.isDesktop;
  const badges = {reminders: overdueReminders};
  const currentNav = activeNav.find(n=>n.id===page);
  const sidebarWidth = vp.isDesktop ? 230 : vp.isTabletLandscape ? 64 : 0;
  const mainPadding = vp.isMobile ? 12 : vp.isTabletLandscape ? 16 : 28;
  return (
    <UserCtx.Provider value={user}><ModeCtx.Provider value={{mode,shopActive}}>
      <div style={{display:"flex",minHeight:"100vh",background:"#f4f6f9"}}>
        {vp.isDesktop && <Sidebar active={page} onNav={setPage} user={user} onLogout={()=>setUser(null)} onRefresh={onRefresh} refreshing={refreshing} nav={activeNav} badges={badges}/>}
        {vp.isTabletLandscape && <IconRail active={page} onNav={setPage} user={user} onLogout={()=>setUser(null)} onRefresh={onRefresh} refreshing={refreshing} nav={activeNav} badges={badges}/>}
        <main style={{marginLeft:sidebarWidth,flex:1,minWidth:0,padding:mainPadding,minHeight:"100vh",paddingBottom:vp.isMobile?"calc(80px + env(safe-area-inset-bottom, 0px))":mainPadding}}>
          {!vp.isDesktop && <TopBar pageLabel={currentNav?.label||"TMS"} mode={mode} onToggleMode={()=>setMode(m=>m==="shop"?"full":"shop")} canToggle={canToggleMode} onRefresh={onRefresh} refreshing={refreshing}/>}
          <div key={`${page}-${refreshKey}`} style={{padding:vp.isMobile?12:0}}>{pages[page]||pages.dashboard}</div>
        </main>
        {vp.isMobile && <BottomNav active={page} onNav={setPage} nav={activeNav} badges={badges}/>}
        {/* Temporary debug indicator: shows the current viewport tier so we can diagnose
            the Samsung tab flicker remotely. Remove once stable. Activate by adding
            ?debug=1 to the URL. */}
        {typeof window !== "undefined" && window.location.search.includes("debug=1") &&
          <div style={{position:"fixed",top:6,right:6,zIndex:9999,background:"rgba(0,0,0,0.78)",color:"#fff",padding:"4px 10px",borderRadius:6,fontSize:11,fontFamily:"monospace"}}>
            {vp.isMobile?"📱 mobile":vp.isTabletLandscape?"📟 tablet":"🖥 desktop"} · {vp.width}px
          </div>
        }
      </div>
    </ModeCtx.Provider></UserCtx.Provider>
  );
};
// Last line of defense: a render error anywhere in the tree shows a reload screen
// instead of a blank white page (which is unrecoverable on a shop tablet).
class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state={error:null}; }
  static getDerivedStateFromError(error){ return {error}; }
  componentDidCatch(error,info){ try{ console.error("App crashed:",error,info); }catch(_){} }
  render(){
    if(this.state.error){
      return (
        <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,textAlign:"center",background:"#f4f6f9",fontFamily:"system-ui,sans-serif"}}>
          <div style={{fontSize:48,marginBottom:12}}>⚠️</div>
          <h2 style={{margin:"0 0 8px",color:"#1a1a2e"}}>Something went wrong</h2>
          <p style={{margin:"0 0 20px",color:"#666",maxWidth:420}}>The app hit an unexpected error. Reload to continue — your data is safe.</p>
          <button onClick={()=>{try{location.reload();}catch(_){}}} style={{padding:"14px 28px",background:"#c0392b",color:"#fff",border:"none",borderRadius:10,fontSize:16,fontWeight:700,cursor:"pointer",minHeight:48}}>Reload</button>
          <pre style={{marginTop:20,maxWidth:"90vw",overflow:"auto",fontSize:11,color:"#aaa",whiteSpace:"pre-wrap"}}>{String(this.state.error&&this.state.error.message||this.state.error)}</pre>
        </div>
      );
    }
    return this.props.children;
  }
}
ReactDOM.render(<ErrorBoundary><App/></ErrorBoundary>, document.getElementById('root'));
</script>
</body>
</html>
