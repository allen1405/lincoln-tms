// ─── VIEWPORT ─────────────────────────────────────────────────────────────────
// Tiers: mobile <900, tablet 900-1279, desktop ≥1280, with 40px hysteresis: once
// committed to a tier, the width must clearly exceed the next boundary before switching.
// Stops Samsung tablets sitting right at 1280 CSS px from flipping on navigation.
// ONE shared store (not per-hook state): hysteresis is path-dependent, so independent
// useViewport() instances mounted at different times could disagree — a modal rendering
// in tablet mode while the shell was desktop. Every component now sees the same tier,
// and body[data-tier] keeps the CSS in lockstep with the JS.
const viewportStore = (() => {
  const BUFFER = 40;
  const measure = () => typeof window === "undefined" ? 1400 : window.innerWidth;
  const rawTier = w => w < 900 ? "mobile" : w < 1280 ? "tablet" : "desktop";
  let state = (() => { const w = measure(); return { tier: rawTier(w), width: w }; })();
  const subs = new Set();
  const syncBody = () => { if (typeof document !== "undefined" && document.body) document.body.dataset.tier = state.tier; };
  syncBody();

    const w = measure();
    let tier = state.tier;
    if (tier === "mobile" && w >= 900 + BUFFER) tier = "tablet";
    else if (tier === "tablet" && w < 900 - BUFFER) tier = "mobile";
    else if (tier === "tablet" && w >= 1280 + BUFFER) tier = "desktop";
    else if (tier === "desktop" && w < 1280 - BUFFER) tier = "tablet";
    if (tier !== state.tier || w !== state.width) {
      state = { tier, width: w };
      syncBody();
      subs.forEach(f => f(state));
    }
  };
  if (typeof window !== "undefined") {
    let raf = 0;
    const on = () => { if (raf) cancelAnimationFrame(raf); raf = requestAnimationFrame(apply); };
    window.addEventListener("resize", on);
    window.addEventListener("orientationchange", on);
  }

})();
const useViewport = () => {

    return viewportStore.sub(setState);
  }, []);

    width: state.width,
    isMobile: state.tier === "mobile",
    isTabletLandscape: state.tier === "tablet",
    isDesktop: state.tier === "desktop"

    .filter(o=>o.toLowerCase().includes(ql))

  const pick=o=>{ onChange(o); setOpen(false); setQ(""); setActive(0); };
  const onKey=e=>{
    if(e.key==="ArrowDown"){ e.preventDefault(); setOpen(true); setActive(a=>Math.min(a+1,matches.length-1)); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); setActive(a=>Math.max(a-1,0)); }
    else if(e.key==="Enter"){ if(matches[active]){ e.preventDefault(); pick(matches[active]); } }
    else if(e.key==="Escape"){ setOpen(false); }
  };
  return (
    <div ref={ref} style={{position:"relative",flex:1,minWidth:0}}>
      <input
        value={open?q:(value||"")}
        placeholder={placeholder||"Search…"}
        onFocus={()=>{setOpen(true);setQ("");setActive(0);}}
        onChange={e=>{setQ(e.target.value);setOpen(true);setActive(0);}}
        onKeyDown={onKey}
        style={{width:"100%",padding:"9px 12px",border:"1px solid #ddd",borderRadius:8,fontSize:14,background:"#fff"}}
      />
      {open&&(
        <div style={{position:"absolute",top:"100%",left:0,right:0,zIndex:60,background:"#fff",border:"1px solid #ddd",borderRadius:8,marginTop:4,maxHeight:240,overflowY:"auto",boxShadow:"0 8px 24px rgba(0,0,0,0.14)"}}>
          {matches.length===0
            ? <div style={{padding:"10px 12px",color:"#aaa",fontSize:13}}>No matches</div>
            : matches.map((o,i)=>(
                <div key={o} onMouseDown={e=>{e.preventDefault();pick(o);}} onMouseEnter={()=>setActive(i)} style={{padding:"10px 12px",cursor:"pointer",fontSize:14,borderBottom:"1px solid #f5f5f5",background:i===active?"#fef0ee":"#fff",fontWeight:o===value?700:400,color:o===value?"#c0392b":"#1a1a2e"}}>{o}</div>
              ))}
        </div>
      )}
    </div>
  );
};

// Client-side resize to keep storage + bandwidth reasonable. Returns a Blob.
const resizePhoto = (file, maxWidth = 1600, quality = 0.85) => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxWidth / img.width);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('canvas toBlob failed')), 'image/jpeg', quality);
    };
    img.onerror = () => reject(new Error('image load failed'));
    img.src = e.target.result;
  };
  reader.onerror = () => reject(new Error('file read failed'));
  reader.readAsDataURL(file);
});

// Reusable photo grid + uploader. Drop wherever an entity needs photos.
// Self-fetches by default. Pass `photos` (+`onChanged`) to feed it from a parent batch
// query instead — rendering one PhotoSection per row used to fire one Supabase query
// each (the DOT tab opened with ~44 simultaneous queries).
const PhotoSection = ({entityType, entityId, label = "📷 Photos", compact = false, photos: photosProp, onChanged}) => {
  const user = useContext(UserCtx);
  const managed = photosProp === undefined; // self-fetching mode
  const [photos, setPhotos] = useState(photosProp || []);
  const [uploading, setUploading] = useState(false);
  const [lightbox, setLightbox] = useState(null);
  const inputRef = React.useRef(null);

  const load = async () => {
    if (!managed) { if (onChanged) onChanged(); return; }
    if (!entityId) { setPhotos([]); return; }
    const {data} = await sb.from('photos').select('*').eq('entity_type', entityType).eq('entity_id', String(entityId)).order('created_at', {ascending: false});
    setPhotos(data || []);
  };
  useEffect(() => { if (managed) load(); }, [entityType, entityId]);
  useEffect(() => { if (!managed) setPhotos(photosProp || []); }, [photosProp]);

  const handleFiles = async (fileList) => {
    if (!fileList || fileList.length === 0 || !entityId) return;
    setUploading(true);
    try {
      for (const file of fileList) {
        if (!file.type.startsWith('image/')) continue;
        const blob = await resizePhoto(file);
        const ts = Date.now();
        const safeName = (file.name || 'photo.jpg').replace(/[^a-zA-Z0-9._-]/g, '_').slice(-60);
        const path = `${entityType}/${entityId}/${ts}-${safeName}`;
        const up = await sb.storage.from('tms-photos').upload(path, blob, {contentType: 'image/jpeg', upsert: false});
        if (up.error) { alert("Upload failed: " + up.error.message); continue; }
        const pub = sb.storage.from('tms-photos').getPublicUrl(path).data.publicUrl;
        const ins = await sb.from('photos').insert([{entity_type: entityType, entity_id: String(entityId), storage_path: path, public_url: pub, uploaded_by: user?.name || ""}]);
        if (ins.error) { await sb.storage.from('tms-photos').remove([path]); alert("Photo record failed: " + ins.error.message); continue; }
        audit(user, "create", "photo", null, `${entityType} ${entityId}`, safeName);
      }
      await load();
    } finally {
      setUploading(false);
      if (inputRef.current) inputRef.current.value = "";
    }
  };

  const del = async (p) => {
    if (!confirm("Delete this photo?")) return;
    // DB row first, then the file — an orphaned storage file is invisible, but an
    // orphaned record renders a broken thumbnail forever.
    const r = await must(sb.from('photos').delete().eq('id', p.id), "Could not delete photo record");
    if (!r) return;
    const rm = await sb.storage.from('tms-photos').remove([p.storage_path]);
    if (rm.error) console.error("photo file removal failed:", rm.error);
    audit(user, "delete", "photo", p.id, `${entityType} ${entityId}`);
    load();
  };

  const tile = compact ? 56 : 96;
  return (
    <div>
      {!compact && <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <div style={{fontSize:13,fontWeight:700,color:"#555"}}>{label} ({photos.length})</div>
        <button onClick={() => inputRef.current?.click()} disabled={uploading||!entityId} style={{padding:"8px 14px",background:"#c0392b",color:"#fff",border:"none",borderRadius:8,cursor:uploading?"wait":"pointer",fontWeight:600,fontSize:13,opacity:uploading||!entityId?0.6:1}}>{uploading?"Uploading...":"📷 Add Photo"}</button>
      </div>}
      <input ref={inputRef} type="file" accept="image/*" capture="environment" multiple onChange={e=>handleFiles(e.target.files)} style={{display:"none"}}/>
      <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
        {photos.map(p => (
          <div key={p.id} style={{position:"relative",width:tile,height:tile,borderRadius:8,overflow:"hidden",background:"#f0f0f0",border:"1px solid #e0e0e0"}}>
            <img src={p.public_url} alt={p.caption||""} loading="lazy" decoding="async" onClick={()=>setLightbox(p)} style={{width:"100%",height:"100%",objectFit:"cover",cursor:"pointer",display:"block"}}/>
            <button className="icon-xs" onClick={()=>del(p)} title="Delete" style={{position:"absolute",top:2,right:2,width:24,height:24,padding:0,background:"rgba(192,57,43,0.92)",color:"#fff",border:"none",borderRadius:4,cursor:"pointer",fontSize:12,lineHeight:1}}>×</button>
          </div>
        ))}
        {compact && <button onClick={()=>inputRef.current?.click()} disabled={uploading||!entityId} title="Add photo" style={{width:tile,height:tile,border:"1px dashed #c0392b",background:"#fff",color:"#c0392b",borderRadius:8,cursor:uploading?"wait":"pointer",fontSize:20,opacity:uploading||!entityId?0.5:1}}>{uploading?"…":"📷"}</button>}
        {!compact && photos.length===0 && <div style={{fontSize:12,color:"#aaa",padding:"10px 0"}}>No photos yet.</div>}
      </div>
      {lightbox && (
        <div onClick={()=>setLightbox(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:16,cursor:"zoom-out",overscrollBehavior:"contain"}}>
          <img src={lightbox.public_url} alt={lightbox.caption||""} style={{maxWidth:"95vw",maxHeight:"95vh",objectFit:"contain",boxShadow:"0 20px 60px rgba(0,0,0,0.6)"}}/>
          <button onClick={e=>{e.stopPropagation();setLightbox(null);}} style={{position:"absolute",top:16,right:16,width:40,height:40,background:"rgba(255,255,255,0.15)",color:"#fff",border:"none",borderRadius:20,cursor:"pointer",fontSize:22}}>×</button>
        </div>
      )}
    </div>
  );
};

const Login = ({onLogin}) => {
  const [email,setEmail]=useState(""); const [pass,setPass]=useState(""); const [err,setErr]=useState(""); const [loading,setLoading]=useState(false);
  const go = async() => {
    setLoading(true); setErr("");
    const {data,error} = await sb.from('users').select('*').eq('email',email).eq('password',pass).eq('active',true).single();
    setLoading(false);
    if(data){onLogin(data);return;}
    // PGRST116 = no matching row (bad credentials). Anything else is a connection/server
    // problem — don't tell the user their password is wrong when the Wi-Fi dropped.
    if(error&&error.code!=="PGRST116"){setErr("Connection problem — check the internet and try again.");return;}
    setErr("Incorrect email or password.");
  };
  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)",display:"flex",alignItems:"center",justifyContent:"center"}}>

// ─── EQUIPMENT MODAL ──────────────────────────────────────────────────────────
const EquipmentModal = ({customerId,customerName,onClose,onSelect}) => {
  const user = useContext(UserCtx);
  const guard = useOnce();
  const [list,setList]=useState([]); const [loading,setLoading]=useState(true);
  const [adding,setAdding]=useState(false);
  const [editEqId,setEditEqId]=useState(null);
  const EQ_EMPTY={type:"Truck",unit_number:"",year:"",make:"",model:"",vin:"",license_plate:"",notes:""};
  const [form,setForm]=useState(EQ_EMPTY);
  const [viewEquip,setViewEquip]=useState(null);
  const [remForm,setRemForm]=useState({note:"",reminder_date:"",auto_days:""});
  const [addingRem,setAddingRem]=useState(false);
  const [reminders,setReminders]=useState([]);
  const [activeTab,setActiveTab]=useState("history");
  const [taskNote,setTaskNote]=useState("");
  const [addingTask,setAddingTask]=useState(false);

  const load=async()=>{
    const{data}=await sb.from('equipment').select('*').eq('customer_id',customerId).order('created_at',{ascending:false});
    setList(data||[]); setLoading(false);
  };
  const loadReminders=async(eqId)=>{
    const{data}=await sb.from('reminders').select('*').eq('equipment_id',eqId).order('created_at',{ascending:false});
    setReminders(data||[]);
  };
  useEffect(()=>{load();},[]);

  const openAddEq=()=>{setForm(EQ_EMPTY);setEditEqId(null);setAdding(true);};
  const openEditEq=(e)=>{setForm({type:e.type||"Truck",unit_number:e.unit_number||"",year:e.year||"",make:e.make||"",model:e.model||"",vin:e.vin||"",license_plate:e.license_plate||"",notes:e.notes||""});setEditEqId(e.id);setAdding(true);};
  const closeEqForm=()=>{setAdding(false);setEditEqId(null);setForm(EQ_EMPTY);};
  const save=async()=>{
    if(!form.type) return;
    const summary=`${customerName} — ${form.type} ${form.year} ${form.make} ${form.model}`.trim();
    const details=[form.unit_number&&`Unit #${form.unit_number}`,form.vin&&`VIN: ${form.vin}`].filter(Boolean).join(", ");
    if(editEqId){
      const res=await sb.from('equipment').update({...form,customer_name:customerName}).eq('id',editEqId);
      if(res.error){alert("Could not save: "+res.error.message);return;}
      audit(user,"update","equipment",editEqId,summary,details);
    }else{
      const {data:inserted,error}=await sb.from('equipment').insert([{...form,customer_id:customerId,customer_name:customerName}]).select().single();
      if(error){alert("Could not save: "+error.message);return;}
      audit(user,"create","equipment",inserted?.id,summary,details);
    }
    closeEqForm(); load();
  };
  const del=async(id)=>{
    if(!confirm("Delete this equipment?"))return;
    const prev=list.find(e=>e.id===id);
    const r=await must(sb.from('equipment').delete().eq('id',id),"Could not delete equipment");
    if(!r)return;
    audit(user,"delete","equipment",id,`${customerName} — ${prev?.type||""} ${prev?.year||""} ${prev?.make||""} ${prev?.model||""}`.trim());
    load();
  };
  const openEquip=async(e)=>{ setViewEquip(e); await loadReminders(e.id); };
  const addReminder=async()=>{
    if(!remForm.note) return;
    const eqLabel=`${viewEquip.year} ${viewEquip.make} ${viewEquip.model||viewEquip.type} (${viewEquip.vin||'no VIN'})`;
    const autoDays=remForm.auto_days?Number(remForm.auto_days):null;
    // "Auto (days from now)" implies a due date — without this the reminder never fires.
    const remDate=remForm.reminder_date||(autoDays?addDaysLocal(autoDays):null);
    const {data:inserted,error}=await sb.from('reminders').insert([{equipment_id:viewEquip.id,customer_name:customerName,equipment_label:eqLabel,note:remForm.note,reminder_date:remDate,auto_days:autoDays,created_by:user.name}]).select().single();
    if(error){alert("Could not save reminder: "+error.message);return;}
    audit(user,"create","reminder",inserted?.id,`${customerName} — ${eqLabel}`,remForm.note.slice(0,120));
    setRemForm({note:"",reminder_date:"",auto_days:""}); setAddingRem(false); loadReminders(viewEquip.id);
  };
  const addTask=async()=>{
    if(!taskNote.trim()) return;
    const eqLabel=`${viewEquip.year} ${viewEquip.make} ${viewEquip.model||viewEquip.type} (${viewEquip.vin||'no VIN'})`;
    const {data:inserted,error}=await sb.from('reminders').insert([{kind:'task',equipment_id:viewEquip.id,customer_name:customerName,equipment_label:eqLabel,note:taskNote.trim(),created_by:user.name}]).select().single();
    if(error){alert("Could not save task: "+error.message);return;}
    audit(user,"create","reminder",inserted?.id,`${customerName} — ${eqLabel}`,`task: ${taskNote.trim().slice(0,110)}`);
    setTaskNote(""); setAddingTask(false); loadReminders(viewEquip.id);
  };
  const completeRem=async(id)=>{
    const prev=reminders.find(r=>r.id===id);
    // .eq('completed',false).select(): only the tap that actually flips the row audits
    // and reschedules — a double-tap (or two devices) would otherwise insert the next
    // auto-recurring occurrence twice.
    const r=await must(sb.from('reminders').update({completed:true}).eq('id',id).eq('completed',false).select(),"Could not complete reminder");
    if(!r)return;
    if(r.data&&r.data.length){
      audit(user,"status_change","reminder",id,`${prev?.customer_name||""} — ${prev?.equipment_label||""}`,`completed: false → true`);
      await rescheduleAutoReminder(user,prev);
    }
    bumpReminders();
    loadReminders(viewEquip.id);
  };
  const label=e=>`${e.year||''} ${e.make||''} ${e.model||e.type}`.trim();
  const eqReminders=reminders.filter(r=>r.kind!=='task');
  const eqTasks=reminders.filter(r=>r.kind==='task');

  if(viewEquip) return (
    <Modal title={`${label(viewEquip)} — ${viewEquip.vin||'No VIN'}`} onClose={()=>setViewEquip(null)} wide>
      <div style={{display:"flex",gap:8,borderBottom:"2px solid #f0f0f0",marginBottom:20,overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
        <button className={`tab-btn${activeTab==="history"?" active":""}`} onClick={()=>setActiveTab("history")}>🔧 Repair History</button>
        <button className={`tab-btn${activeTab==="reminders"?" active":""}`} onClick={()=>setActiveTab("reminders")}>🔔 Reminders ({eqReminders.filter(r=>!r.completed).length})</button>
        <button className={`tab-btn${activeTab==="tasks"?" active":""}`} onClick={()=>setActiveTab("tasks")}>📋 Future Tasks ({eqTasks.filter(r=>!r.completed).length})</button>
      </div>
      {activeTab==="history"&&(
        <div>
          <p style={{color:"#888",fontSize:13}}>Repair history is pulled automatically from Work Orders linked to this equipment's VIN or unit number.</p>
        </div>
      )}
      {activeTab==="reminders"&&(
        <div>
          {!addingRem&&<button onClick={()=>setAddingRem(true)} style={{marginBottom:16,padding:"9px 16px",background:"#c0392b",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>+ Add Reminder</button>}
          {addingRem&&(
            <div style={{background:"#f8f9fa",borderRadius:10,padding:16,marginBottom:16}}>
              <Field label="Reminder Note" value={remForm.note} onChange={v=>setRemForm(p=>({...p,note:v}))} placeholder="e.g. Call for oil change, DOT inspection due..." required type="textarea"/>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                <Field label="Specific Date" value={remForm.reminder_date} onChange={v=>setRemForm(p=>({...p,reminder_date:v}))} type="date"/>
                <Field label="Auto (days from now)" value={remForm.auto_days} onChange={v=>setRemForm(p=>({...p,auto_days:v}))} type="number" placeholder="e.g. 90"/>
              </div>
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>guard(addReminder)} style={{padding:"9px 16px",background:"#c0392b",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>Save Reminder</button>
                <button onClick={()=>setAddingRem(false)} style={{padding:"9px 16px",background:"#f0f0f0",border:"none",borderRadius:8,cursor:"pointer",fontSize:13}}>Cancel</button>
              </div>
            </div>
          )}
          {eqReminders.length===0&&<p style={{color:"#aaa",fontSize:13}}>No reminders yet.</p>}
          {eqReminders.map(r=>(
            <div key={r.id} style={{border:`1px solid ${r.completed?"#a9dfbf":r.reminder_date&&r.reminder_date<todayLocal()?"#f5c6cb":"#eee"}`,borderRadius:10,padding:14,marginBottom:10,background:r.completed?"#f9fff9":"#fff"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div>
                  <div style={{fontWeight:600,fontSize:14,color:r.completed?"#888":"#1a1a2e",textDecoration:r.completed?"line-through":""}}>{r.note}</div>
                  <div style={{fontSize:12,color:"#888",marginTop:4}}>
                    {r.reminder_date&&<span>📅 {fmtDay(r.reminder_date)} &nbsp;</span>}
                    {r.auto_days&&<span>🔄 Every {r.auto_days} days &nbsp;</span>}
                    <span>👤 {r.created_by} · {fmtDate(r.created_at)}</span>
                  </div>
                </div>
                {!r.completed&&<button onClick={()=>completeRem(r.id)} style={{padding:"6px 12px",background:"#27ae60",color:"#fff",border:"none",borderRadius:6,cursor:"pointer",fontSize:12,fontWeight:600}}>✓ Done</button>}
              </div>
            </div>
          ))}
        </div>
      )}
      {activeTab==="tasks"&&(
        <div>
          <p style={{color:"#888",fontSize:13,marginTop:0}}>Deferred work to do next time this unit is in the shop. Shows on any work order for this equipment.</p>
          {!addingTask&&<button onClick={()=>setAddingTask(true)} style={{marginBottom:16,padding:"9px 16px",background:"#c0392b",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>+ Add Task</button>}
          {addingTask&&(
            <div style={{background:"#f8f9fa",borderRadius:10,padding:16,marginBottom:16}}>
              <Field label="Task" value={taskNote} onChange={setTaskNote} placeholder="e.g. Replace air dryer next visit" required type="textarea"/>
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>guard(addTask)} style={{padding:"9px 16px",background:"#c0392b",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>Save Task</button>
                <button onClick={()=>setAddingTask(false)} style={{padding:"9px 16px",background:"#f0f0f0",border:"none",borderRadius:8,cursor:"pointer",fontSize:13}}>Cancel</button>
              </div>
            </div>
          )}
          {eqTasks.length===0&&<p style={{color:"#aaa",fontSize:13}}>No future tasks yet.</p>}
          {eqTasks.map(r=>(
            <div key={r.id} style={{border:`1px solid ${r.completed?"#a9dfbf":"#eee"}`,borderRadius:10,padding:14,marginBottom:10,background:r.completed?"#f9fff9":"#fff"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div>
                  <div style={{fontWeight:600,fontSize:14,color:r.completed?"#888":"#1a1a2e",textDecoration:r.completed?"line-through":""}}>📋 {r.note}</div>
                  <div style={{fontSize:12,color:"#888",marginTop:4}}><span>👤 {r.created_by} · {fmtDate(r.created_at)}</span></div>
                </div>
                {!r.completed&&<button onClick={()=>completeRem(r.id)} style={{padding:"6px 12px",background:"#27ae60",color:"#fff",border:"none",borderRadius:6,cursor:"pointer",fontSize:12,fontWeight:600}}>✓ Done</button>}
              </div>
            </div>
          ))}
        </div>
      )}
    </Modal>
  );

  return (
    <Modal title={`Equipment — ${customerName}`} onClose={onClose}>
      {!adding&&<button onClick={openAddEq} style={{marginBottom:16,padding:"9px 16px",background:"#c0392b",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>+ Add Equipment</button>}
      {adding&&(
        <div style={{background:"#f8f9fa",borderRadius:10,padding:16,marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:"#555",marginBottom:10}}>{editEqId?"Edit equipment":"Add equipment"}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <Field label="Type" value={form.type} onChange={v=>setForm(p=>({...p,type:v}))} options={EQUIP_TYPES}/>
            <Field label="Unit Number" value={form.unit_number} onChange={v=>setForm(p=>({...p,unit_number:v}))} placeholder="e.g. 221"/>
            <Field label="Year" value={form.year} onChange={v=>setForm(p=>({...p,year:v}))} placeholder="2020"/>
            <Field label="Make" value={form.make} onChange={v=>setForm(p=>({...p,make:v}))} placeholder="Peterbilt"/>
            <Field label="Model" value={form.model} onChange={v=>setForm(p=>({...p,model:v}))} placeholder="389"/>
            <Field label="VIN" value={form.vin} onChange={v=>setForm(p=>({...p,vin:v}))}/>
            <Field label="License Plate" value={form.license_plate} onChange={v=>setForm(p=>({...p,license_plate:v}))}/>
          </div>
          <Field label="Notes" value={form.notes} onChange={v=>setForm(p=>({...p,notes:v}))} type="textarea"/>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>guard(save)} style={{padding:"9px 16px",background:"#c0392b",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>{editEqId?"Save Changes":"Save Equipment"}</button>
            <button onClick={closeEqForm} style={{padding:"9px 16px",background:"#f0f0f0",border:"none",borderRadius:8,cursor:"pointer",fontSize:13}}>Cancel</button>
          </div>
        </div>
      )}
      {loading?<Loading/>:list.length===0?<p style={{color:"#aaa",fontSize:13}}>No equipment added yet.</p>:list.map(e=>(
        <div key={e.id} style={{border:"1px solid #eee",borderRadius:10,padding:14,marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontWeight:700,fontSize:14}}>{e.type} — {e.year} {e.make} {e.model}</div>
              {e.unit_number&&<div style={{fontSize:12,color:"#c0392b",fontWeight:600,marginTop:2}}>Unit #: {e.unit_number}</div>}
              {e.vin&&<div style={{fontSize:12,color:"#666",marginTop:2}}>VIN: {e.vin}</div>}
              {e.license_plate&&<div style={{fontSize:12,color:"#666"}}>Plate: {e.license_plate}</div>}
              {e.notes&&<div style={{fontSize:12,color:"#888",marginTop:2}}>{e.notes}</div>}
            </div>
            <div style={{display:"flex",gap:8}}>
              {onSelect&&<button onClick={()=>onSelect(e)} style={{padding:"7px 14px",background:"#27ae60",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600}}>Select</button>}
              <button onClick={()=>openEquip(e)} style={{padding:"7px 14px",background:"#1a1a2e",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13}}>History & Reminders</button>
              <button onClick={()=>openEditEq(e)} style={{padding:"7px 12px",background:"#3498db",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600}} title="Edit equipment">✏️</button>
              <button onClick={()=>del(e.id)} style={{padding:"7px 10px",background:"#c0392b",color:"#fff",border:"none",borderRadius:8,cursor:"pointer"}}>🗑</button>
            </div>
          </div>
          <div style={{marginTop:10}}>
            <PhotoSection entityType="equipment" entityId={e.id} compact={true} label="Equipment photos"/>
          </div>
        </div>
      ))}
    </Modal>
  );
};

// ─── INSPECTION FORMS (shared) ───────────────────────────────────────────────
// Reusable page-2 "Inspection Results" editor: a dynamic checkbox + free-text finding list.
const FindingsEditor = ({findings, onChange}) => {
  const rows = findings && findings.length ? findings : [];
  const set = (i, patch) => onChange(rows.map((r, idx) => idx === i ? {...r, ...patch} : r));
  const add = () => onChange([...rows, {checked:false, text:""}]);
  const del = (i) => onChange(rows.filter((_, idx) => idx !== i));
  return (
    <div>
      {rows.length === 0 && <p style={{color:"#aaa",fontSize:13,margin:"6px 0"}}>No findings yet — add the first result below.</p>}
      {rows.map((r, i) => (
        <div key={i} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
          <input type="checkbox" checked={!!r.checked} onChange={e=>set(i,{checked:e.target.checked})} style={{width:18,height:18,flex:"0 0 auto",cursor:"pointer"}}/>
          <input value={r.text||""} onChange={e=>set(i,{text:e.target.value})} placeholder="Result / finding…" style={{flex:1,padding:"8px 10px",border:"1px solid #ddd",borderRadius:8,fontSize:13}}/>
          <button onClick={()=>del(i)} title="Remove" style={{padding:"6px 10px",background:"#f0f0f0",border:"none",borderRadius:8,cursor:"pointer",flex:"0 0 auto"}}>🗑</button>
        </div>
      ))}
      <button onClick={add} style={{marginTop:4,padding:"8px 14px",background:"#1a1a2e",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600}}>＋ Add finding</button>
    </div>
  );
};

    const {data:inserted,error}=await sb.from('jobs').insert([{work_order_id:jobsModal.id,name:name.trim(),status:"Pending",created_by:user.name}]).select().single();
    if(error){alert("Could not add job: "+error.message);return;}
    audit(user,"create","job",inserted?.id,`${jobsModal.id} — ${name.trim()}`);
    setNewJobName(""); setCustomJob(""); loadJobs(jobsModal.id);
  };
  const updJob=async(id,status)=>{
    const prev=jobsList.find(j=>j.id===id);
    const r=await must(sb.from('jobs').update({status}).eq('id',id),"Could not change job status");
    if(!r){loadJobs(jobsModal.id);return;}
    audit(user,"status_change","job",id,`${jobsModal.id} — ${prev?.name||""}`,`status: "${prev?.status||""}" → "${status}"`);
    loadJobs(jobsModal.id);
  };
  const delJob=async(id)=>{
    const prev=jobsList.find(j=>j.id===id);
    if(!confirm(`Delete job "${prev?.name||""}"?`))return;
    const r=await must(sb.from('jobs').delete().eq('id',id),"Could not delete job");
    if(!r)return;
    audit(user,"delete","job",id,`${jobsModal.id} — ${prev?.name||""}`);
    loadJobs(jobsModal.id);
  };
  const startEditJob=(j)=>setEditingJob({id:j.id,name:j.name||""});
  const cancelEditJob=()=>setEditingJob({id:null,name:""});
  const saveJobName=async()=>{
    const j=jobsList.find(x=>x.id===editingJob.id);
    if(!j){cancelEditJob();return;}
    const v=(editingJob.name||"").trim();
    if(!v||v===j.name){cancelEditJob();return;}
    const res=await sb.from('jobs').update({name:v}).eq('id',j.id);
    if(res.error){alert("Could not rename: "+res.error.message);return;}
    audit(user,"update","job",j.id,`${jobsModal.id} — ${v}`,`name: "${j.name}" → "${v}"`);
    cancelEditJob();
    loadJobs(jobsModal.id);
  };
  const openAddPart=()=>{setPartForm(PART_EMPTY);setEditPartId(null);setAddingPart(true);};
  const openEditPart=(p)=>{setPartForm({name:p.name||"",description:p.description||"",part_number:p.part_number||"",quantity:p.quantity??1,status:p.status||"Pending Order",eta_delivery:p.eta_delivery||""});setEditPartId(p.id);setAddingPart(true);};
  const closePartForm=()=>{setAddingPart(false);setEditPartId(null);setPartForm(PART_EMPTY);};
  useEffect(()=>{ if(addingPart&&partFormRef.current) partFormRef.current.scrollIntoView({behavior:"smooth",block:"center"}); },[addingPart,editPartId]);
  // Feed a "Pending Order" WO part into the shop's Order Parts queue (one row per source part).
  const syncOrderPart=async(srcId,p,woId)=>{
    try{
      const {data:ex}=await sb.from('order_parts').select('id').eq('source_part_id',srcId).maybeSingle();
      if(ex) await sb.from('order_parts').update({name:p.name,part_number:p.part_number||null,quantity:Number(p.quantity)||1}).eq('id',ex.id);
      else await sb.from('order_parts').insert([{name:p.name,part_number:p.part_number||null,quantity:Number(p.quantity)||1,work_order_id:woId,source_part_id:srcId,status:'Pending',urgency:'Medium',created_by:user.name}]);
    }catch(_){}
  };
  const savePart=async()=>{
    if(!partForm.name.trim()) return;
    const payload={name:partForm.name.trim(),description:partForm.description,part_number:partForm.part_number,quantity:Number(partForm.quantity),status:partForm.status,eta_delivery:partForm.eta_delivery||null};
    let srcId=editPartId;
    if(editPartId){
      const res=await sb.from('parts').update(payload).eq('id',editPartId);
      if(res.error){alert("Could not save: "+res.error.message);return;}
      audit(user,"update","part",editPartId,`${jobsModal.id} — ${payload.name}`,`qty: ${payload.quantity}, status: ${payload.status}`);
    }else{
      const {data:inserted,error}=await sb.from('parts').insert([{...payload,work_order_id:jobsModal.id,created_by:user.name}]).select().single();
      if(error){alert("Could not save: "+error.message);return;}
      srcId=inserted?.id;
      audit(user,"create","part",inserted?.id,`${jobsModal.id} — ${payload.name}`,`qty: ${payload.quantity}, status: ${payload.status}`);
    }
    if(payload.status==="Pending Order"&&srcId) await syncOrderPart(srcId,payload,jobsModal.id);
    closePartForm(); loadParts(jobsModal.id);
  };
  const updPart=async(id,field,val)=>{
    const prev=partsList.find(p=>p.id===id);
    const r=await must(sb.from('parts').update({[field]:val}).eq('id',id),"Could not update part");
    if(!r){loadParts(jobsModal.id);return;}
    audit(user,"update","part",id,`${jobsModal.id} — ${prev?.name||""}`,`${field}: "${prev?.[field]??""}" → "${val??""}"`);
    if(field==="status"&&val==="Pending Order") syncOrderPart(id,{name:prev?.name,part_number:prev?.part_number,quantity:prev?.quantity},jobsModal.id);
    loadParts(jobsModal.id);
  };
  const delPart=async(id)=>{
    if(!confirm("Delete part?"))return;
    const prev=partsList.find(p=>p.id===id);
    const r=await must(sb.from('parts').delete().eq('id',id),"Could not delete part");
    if(!r)return;
    audit(user,"delete","part",id,`${jobsModal.id} — ${prev?.name||""}`);
    loadParts(jobsModal.id);
  };
  const saveShopSupply=async()=>{
    // Skip when unchanged — the Save button blurs the textarea first, which would
    // otherwise fire this twice (blur + click) and double-log the audit entry.
    if(shopSupply===shopSupplySaved.current)return;
    const r=await must(sb.from('work_orders').update({shop_supply:shopSupply}).eq('id',jobsModal.id),"Could not save shop supply");
    if(!r)return;
    shopSupplySaved.current=shopSupply;
    audit(user,"update","shop_supply",jobsModal.id,`${jobsModal.id} — ${jobsModal.customer}`,`length: ${shopSupply.length} chars`);
  };
  const selEquip=async(e)=>{
    pickedEquip.current=true;
    setForm(p=>({...p,equipment_id:e.id,vehicle_type:e.type||p.vehicle_type,unit_number:e.unit_number||e.vin||e.license_plate||`${e.type}-${e.id}`,vin:e.vin||""}));
    setEquipModal(null);
    // Surface any open reminders left on this unit from past jobs as an acknowledge popup.
    const {data}=await sb.from('reminders').select('*').eq('equipment_id',e.id).eq('completed',false).neq('kind','task').order('created_at',{ascending:false});
    if(data&&data.length) setAckEquip({equipment:e,items:data});
  };

  if(loading) return <Loading/>;
  // The editable WO form body — shared by the standalone edit Modal (New WO on any tier,
  // Edit on mobile/tablet) and the desktop combined view's left column. ctx drives only
  // the close/save/void wiring; the fields are identical.
  const renderWoForm=(ctx)=>{
    const isCombined=ctx==="combined";
    return (<>
      {woErr&&<div style={{background:"#fdecea",color:"#c0392b",padding:"10px 14px",borderRadius:8,fontSize:13,marginBottom:14,fontWeight:600}}>⚠️ {woErr}</div>}
      <Field label="WO Number" value={form.id} onChange={v=>setForm(p=>({...p,id:v}))} required placeholder="e.g. WO-1042"/>
      <div style={{marginBottom:14}}>
        <label style={{display:"block",fontSize:13,fontWeight:600,color:"#555",marginBottom:5}}>Customer <span style={{color:"#c0392b"}}>*</span></label>
        <div style={{display:"flex",gap:8}}>
          <Combobox value={form.customer} onChange={name=>setForm(p=>({...p,customer:name}))} options={customers.map(c=>c.name)} placeholder="Search customer…"/>
          <button onClick={()=>setNewCustModal(true)} style={{padding:"9px 14px",background:"#1a1a2e",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600,whiteSpace:"nowrap"}}>+ New</button>
        </div>
      </div>
      <div style={{marginBottom:14}}>
        <label style={{display:"block",fontSize:13,fontWeight:600,color:"#555",marginBottom:5}}>Equipment / Unit <span style={{color:"#c0392b"}}>*</span></label>
        <div style={{display:"flex",gap:8}}>
          <input value={form.unit_number} onChange={e=>setForm(p=>({...p,unit_number:e.target.value}))} placeholder="Unit number or select from customer equipment" style={{flex:1,padding:"9px 12px",border:"1px solid #ddd",borderRadius:8,fontSize:14}}/>
          {form.customer&&<button onClick={()=>{const c=customers.find(x=>x.name===form.customer);if(c)setEquipModal(c);}} style={{padding:"9px 14px",background:"#1a1a2e",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600,whiteSpace:"nowrap"}}>📋 Pick</button>}
        </div>
      </div>
      {formEquipItems&&(
        <div style={{background:"#fef9e7",border:"1px solid #f7dc6f",borderRadius:10,padding:"10px 14px",marginBottom:14}}>
          <div style={{fontSize:13,fontWeight:700,color:"#9a7d0a",marginBottom:6}}>⚠ This unit has {formEquipItems.items.filter(i=>i.kind==='task').length} open task(s) · {formEquipItems.items.filter(i=>i.kind!=='task').length} reminder(s)</div>
          {formEquipItems.items.map(i=>(
            <div key={i.id} style={{fontSize:13,color:"#7d6608",marginBottom:3}}>{i.kind==='task'?'📋':'🔔'} {i.note}{i.reminder_date?` (due ${fmtDay(i.reminder_date)})`:''}</div>
          ))}
        </div>
      )}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <Field label="Type" value={form.vehicle_type} onChange={v=>setForm(p=>({...p,vehicle_type:v}))} options={["",...EQUIP_TYPES]}/>
        <Field label="VIN" value={form.vin} onChange={v=>setForm(p=>({...p,vin:v}))} required/>
        <Field label="Created by" value={form.mechanic} onChange={v=>setForm(p=>({...p,mechanic:v}))} options={["",...mechanics]} required/>
        <Field label="Status" value={form.status} onChange={v=>setForm(p=>({...p,status:v}))} options={WO_STATUSES}/>
        <Field label="Start date" value={form.date} onChange={v=>setForm(p=>({...p,date:v}))} type="date"/>
        <Field label="Labor rate ($/hr)" value={form.labor} onChange={v=>setForm(p=>({...p,labor:v}))} type="number" placeholder="e.g. 160"/>
        <Field label="Parts ($)" value={form.parts} onChange={v=>setForm(p=>({...p,parts:v}))} type="number"/>
      </div>
      {form.end_date&&<div style={{background:"#eafaf1",border:"1px solid #a9dfbf",borderRadius:8,padding:"8px 12px",margin:"4px 0 0",fontSize:13,color:"#1e8449",fontWeight:600}}>✅ Completed (end date): {fmtDay(form.end_date)} <span style={{fontWeight:400,color:"#7f8c8d"}}>— set automatically when moved to Done</span></div>}
      <div style={{fontSize:12,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:0.5,margin:"14px 0 8px"}}>Vehicle readings <span style={{textTransform:"none",fontWeight:400,color:"#aaa"}}>(leave blank if N/A)</span></div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <Field label="Truck mileage" value={form.truck_mileage} onChange={v=>setForm(p=>({...p,truck_mileage:v}))} type="number" placeholder="e.g. 234567"/>
        <Field label="APU hours (total)" value={form.apu_hours} onChange={v=>setForm(p=>({...p,apu_hours:v}))} type="number" placeholder="e.g. 8523"/>
        <Field label="APU hours since last oil change" value={form.apu_hours_since_oil} onChange={v=>setForm(p=>({...p,apu_hours_since_oil:v}))} type="number"/>
        <Field label="Reefer hours (total)" value={form.reefer_hours} onChange={v=>setForm(p=>({...p,reefer_hours:v}))} type="number"/>
        <Field label="Reefer hours since last oil change" value={form.reefer_hours_since_oil} onChange={v=>setForm(p=>({...p,reefer_hours_since_oil:v}))} type="number"/>
      </div>
      <Field label="Description" value={form.description} onChange={v=>setForm(p=>({...p,description:v}))} type="textarea"/>
      <label style={{display:"flex",alignItems:"center",gap:8,margin:"4px 0 8px",cursor:"pointer",fontSize:14,fontWeight:600,color:"#555"}}>
        <input type="checkbox" checked={!!form.is_road_call} onChange={e=>setForm(p=>({...p,is_road_call:e.target.checked}))} style={{width:16,height:16,cursor:"pointer",accentColor:"#c0392b"}}/>
        🚨 Road call
      </label>
      <div style={{display:"flex",justifyContent:"space-between",gap:10,marginTop:8,alignItems:"center",flexWrap:"wrap"}}>
        <div>
          {editId&&(()=>{
            const w=wos.find(x=>x.id===editId);
            if(!w) return null;
            if(w.is_voided) return <button onClick={()=>restoreWo(editId,isCombined?"combined":"standalone")} style={{padding:"10px 18px",background:"#27ae60",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:600}}>↺ Restore from voided</button>;
            return <button onClick={()=>voidWo(editId,isCombined?"combined":"standalone")} style={{padding:"10px 18px",background:"#fff",color:"#c0392b",border:"1px solid #c0392b",borderRadius:8,cursor:"pointer",fontWeight:600}}>🚫 Void WO</button>;
          })()}
        </div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={isCombined?closeCombined:closeWoModal} style={{padding:"10px 18px",background:"#f0f0f0",border:"none",borderRadius:8,cursor:"pointer"}}>Cancel</button>
          <button onClick={()=>guard(editId?()=>saveEdit(isCombined):add)} style={{padding:"10px 18px",background:"#c0392b",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:600}}>{editId?"Save Changes":"Create WO"}</button>
        </div>
      </div>
    </>);
  };
  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <h1 style={{margin:0,fontSize:26,fontWeight:800,color:"#1a1a2e"}}>Work Orders</h1>
        <Btn label="Add new order" onClick={openAdd} color="#c0392b"/>
      </div>
      {shopActive&&<div style={{background:"#fff4e6",border:"1px solid #f9d8a1",borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:12,color:"#7a4c10",display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:14}}>🔧</span>
        <span>Showing work orders <strong>{user.name}</strong> created or has a job on. Switch to 🖥 Full view to see all.</span>
      </div>}
      <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:16,borderBottom:"2px solid #f0f0f0"}}>
        <div style={{display:"flex",gap:6}}>
          {[["active","Active",wos.filter(w=>!w.is_voided).length],["voided","🚫 Voided",wos.filter(w=>w.is_voided).length]].map(([k,l,n])=>(
            <button key={k} onClick={()=>setView(k)} style={{padding:"10px 18px",background:"none",border:"none",cursor:"pointer",fontSize:14,fontWeight:view===k?700:500,color:view===k?"#c0392b":"#888",borderBottom:view===k?"2px solid #c0392b":"2px solid transparent",marginBottom:-2}}>{l} <span style={{fontSize:11,color:"#aaa",fontWeight:400}}>({n})</span></button>
          ))}
        </div>
        {view==="active"&&<div style={{width:1,height:22,background:"#e5e5e5",alignSelf:"center"}}/>}
        {view==="active"&&<div style={{display:"flex",gap:6,overflowX:"auto",flex:1,paddingBottom:8,marginBottom:-2}}>
          {WO_STATUSES.map(s=>{
            const count=wos.filter(w=>!w.is_voided&&w.status===s).length;
            const sel=statusFilter===s;
            return (
              <button key={s} onClick={()=>setStatusFilter(sel?null:s)} title={sel?"Click to clear filter":"Filter to "+s} style={{display:"flex",alignItems:"center",gap:6,whiteSpace:"nowrap",padding:"6px 12px",borderRadius:20,border:"1px solid "+(sel?"#c0392b":"#e0e0e0"),background:sel?"#c0392b":"#fff",color:sel?"#fff":"#555",cursor:"pointer",fontSize:12,fontWeight:600}}>
                <span>{s}</span>
                <span style={{fontSize:10,opacity:0.85,fontWeight:500}}>{count}</span>
                {sel&&<span style={{marginLeft:2,fontSize:14,lineHeight:1,fontWeight:700}}>×</span>}
              </button>
            );
          })}
        </div>}
      </div>
      <div style={{position:"relative",marginBottom:20,maxWidth:320}}>
        <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:"#aaa"}}>🔍</span>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search work orders..." style={{width:"100%",padding:"10px 12px 10px 36px",border:"1px solid #ddd",borderRadius:8,fontSize:14}}/>
      </div>
      {view==="voided"&&(
        <div style={{background:"#fff",borderRadius:12,overflow:"auto",boxShadow:"0 2px 12px rgba(0,0,0,0.06)"}}>
          <table style={{width:"100%",borderCollapse:"collapse",minWidth:640}}>
            <thead><tr><TH c="WO #"/><TH c="Customer"/><TH c="Unit"/><TH c="Status when voided"/><TH c="Voided at"/><TH c="By"/><TH c=""/></tr></thead>
            <tbody>{(()=>{const vl=filtered.filter(w=>w.is_voided).sort((a,b)=>String(b.voided_at||"").localeCompare(String(a.voided_at||""))); if(vl.length===0) return <tr><td colSpan={7} style={{textAlign:"center",padding:40,color:"#aaa"}}>No voided work orders.</td></tr>; return vl.map((w,i)=>(
              <tr key={w.id} style={{background:i%2===0?"#fff":"#fafafa"}}>
                <td style={{padding:"10px 14px",fontSize:13,borderBottom:"1px solid #f5f5f5",fontWeight:700,color:"#c0392b"}}><span onClick={()=>openEdit(w)} style={{cursor:"pointer",textDecoration:"underline",textDecorationStyle:"dotted"}} title="Click to view/edit">{w.id}</span></td>
                <td style={{padding:"10px 14px",fontSize:13,borderBottom:"1px solid #f5f5f5"}}>{w.customer}</td>
                <td style={{padding:"10px 14px",fontSize:13,borderBottom:"1px solid #f5f5f5"}}>{w.unit_number}</td>
                <td style={{padding:"10px 14px",borderBottom:"1px solid #f5f5f5"}}><Badge s={w.status}/></td>
                <td style={{padding:"10px 14px",fontSize:12,borderBottom:"1px solid #f5f5f5",color:"#555"}}>{w.voided_at?fmtDate(w.voided_at):"—"}</td>
                <td style={{padding:"10px 14px",fontSize:13,borderBottom:"1px solid #f5f5f5"}}>{w.voided_by||"—"}</td>
                <td style={{padding:"10px 14px",borderBottom:"1px solid #f5f5f5",textAlign:"right"}}>
                  <button onClick={()=>restoreWo(w.id)} style={{padding:"6px 12px",background:"#27ae60",color:"#fff",border:"none",borderRadius:6,cursor:"pointer",fontSize:12,fontWeight:600}}>↺ Restore</button>
                </td>
              </tr>
            ));})()}</tbody>
          </table>
        </div>
      )}
      {/* Desktop: cap the board to the viewport so columns scroll internally and the
          horizontal scrollbar stays on screen instead of below a page-tall board. */}
      {view==="active"&&statusFilter===null&&<div style={{display:"flex",gap:12,overflowX:"auto",paddingBottom:12,...(vp.isDesktop?{maxHeight:"calc(100vh - 215px)"}:{})}}>
        {WO_STATUSES.map(col=>{
          const cards=filtered.filter(w=>w.status===col&&!w.is_voided);
          return (
            <div key={col} style={{minWidth:260,flex:1,background:col==="Done"||col==="Paid"?"#f0faf4":"#f8f9fa",borderRadius:12,padding:12,display:"flex",flexDirection:"column",minHeight:0}}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:12,flexShrink:0}}><Badge s={col}/><span style={{fontSize:12,color:"#888"}}>{cards.length}</span></div>
              <div style={{overflowY:"auto",minHeight:0,flex:1}}>
              {cards.length===0?<div style={{textAlign:"center",color:"#ccc",fontSize:13,padding:"20px 0"}}>Empty</div>
              :cards.map(w=>(
                <div key={w.id} style={{background:"#fff",borderRadius:10,padding:12,marginBottom:8,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                    <span onClick={()=>openWoCard(w)} style={{fontWeight:700,fontSize:12,color:"#c0392b",cursor:"pointer",textDecoration:"underline",textDecorationStyle:"dotted"}} title={vp.isDesktop?"Click to open / edit this work order":"Click to open details (jobs, parts, notes, DOT)"}>{w.id}</span>
                    <div style={{display:"flex",gap:4}}>
                      {!vp.isDesktop&&<button onClick={()=>openEdit(w)} style={{background:"none",border:"none",cursor:"pointer",fontSize:13,minWidth:36}} title="Edit work order">✏️</button>}
                      <button onClick={()=>del(w.id)} style={{background:"#fdecea",border:"none",borderRadius:6,padding:"2px 6px",cursor:"pointer",color:"#c0392b",fontSize:13,minWidth:36}} title="Delete WO">🗑</button>
                    </div>
                  </div>
                  {w.is_road_call&&<div style={{display:"inline-block",background:"#c0392b",color:"#fff",fontSize:9,fontWeight:800,letterSpacing:0.5,padding:"2px 6px",borderRadius:4,marginBottom:4}}>🚨 ROAD CALL</div>}
                  <div style={{fontWeight:600,fontSize:13,marginBottom:2}}>{w.customer}</div>
                  <div style={{fontSize:12,color:"#666",marginBottom:2}}>🚛 {w.unit_number}</div>
                  <div style={{fontSize:11,color:"#888",marginBottom:4}}>{w.description}</div>
                  <div style={{fontSize:11,color:"#aaa",marginBottom:4}}>👨‍🔧 Created by {w.mechanic||"—"}</div>
                  <div style={{fontSize:11,fontWeight:600,color:"#27ae60",marginBottom:6}}>Labor: {jobLabor[w.id]||0}h · Parts: ${w.parts}</div>
                  {w.end_date&&<div style={{fontSize:11,fontWeight:700,color:"#1e8449",marginBottom:6}}>✅ Completed {fmtDay(w.end_date)}</div>}
                  <select value={w.status} onChange={e=>upd(w.id,e.target.value)} style={{width:"100%",padding:"4px 8px",border:"1px solid #eee",borderRadius:6,fontSize:11,cursor:"pointer"}}>
                    {WO_STATUSES.map(s=><option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
              ))}
              </div>
            </div>
          );
        })}
      </div>}
      {view==="active"&&statusFilter!==null&&(()=>{
        const list=filtered.filter(w=>w.status===statusFilter&&!w.is_voided);
        if(list.length===0) return <div style={{padding:40,textAlign:"center",color:"#aaa",background:"#fff",borderRadius:12,boxShadow:"0 2px 12px rgba(0,0,0,0.06)"}}>No work orders in "{statusFilter}".</div>;
        return <div>{list.map(w=>{
          const jobs=jobsByWo[w.id]||[];
          const parts=partsByWo[w.id]||[];
          const noteCount=notesByWo[w.id]||0;
          const agg=aggregatePartsStatus(parts);
          return (
            <div key={w.id} style={{display:"grid",gridTemplateColumns:vp.isMobile?"1fr":"240px 1fr",gap:12,marginBottom:10,alignItems:"stretch"}}>
              <div style={{background:"#fff",borderRadius:10,padding:12,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
